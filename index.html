<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Her</title>

    <link rel="stylesheet" href="../css/main.css">

</head>

<body>

<main class="auth-page">

    <section class="auth-card">

        <div class="text-center">

            <h1>Welcome Back</h1>

            <p>
                Sign in to continue writing.
            </p>

        </div>

        <form class="form" id="loginForm">

            <div>

                <label class="label">
                    Username or Email
                </label>

                <input
                    class="input"
                    id="loginIdentifier"
                    type="text"
                    required>

            </div>

            <div>

                <label class="label">
                    Password
                </label>

                <input
                    class="input"
                    id="loginPassword"
                    type="password"
                    required>

            </div>

            <button
                class="btn"
                type="submit">

                Login

            </button>

        </form>

        <div class="text-center">

            <p>

                Don't have an account?

                <a href="signup.html">

                    Create one

                </a>

            </p>

        </div>

    </section>

</main>

<script src="../js/config.js"></script>

<script src="../js/utils/constants.js"></script>

<script src="../js/utils/helpers.js"></script>

<script src="../js/app.js"></script>

<script src="../js/modules/auth/session.js"></script>

<script src="../js/modules/auth/login.js"></script>

<script src="../js/modules/ui/notifications.js"></script>

<script>

document
.getElementById("loginForm")
.addEventListener("submit",function(e){

    e.preventDefault();

    const identifier =
        document.getElementById("loginIdentifier").value;

    const password =
        document.getElementById("loginPassword").value;

    const result =
        HerLogin.login(identifier,password);

    if(result.success){

        HerNotifications.success(result.message);

        setTimeout(()=>{

            window.location.href="dashboard.html";

        },500);

    }else{

        HerNotifications.error(result.message);

    }

});

</script>

</body>

</html>
