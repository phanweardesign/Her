<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Magic System | Her</title><link rel="stylesheet" href="../css/main.css">
<style>
:root{
    --bg:#120d1f;
    --panel:#1d1630;
    --card:#261d3c;
    --purple:#8b5cf6;
    --purple-soft:#c9b6ff;
    --text:#ffffff;
    --muted:#b9aecb;
    --border:rgba(255,255,255,.09);
    --shadow:0 18px 45px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{
    min-height:100vh;
    margin:0;
    background:
        radial-gradient(circle at top right,rgba(139,92,246,.18),transparent 35%),
        var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app-header{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:18px 28px;
    background:rgba(18,13,31,.94);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(14px);
}
.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:22px;
    font-weight:800;
    white-space:nowrap;
}
.navbar{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    flex-wrap:wrap;
}
.nav-link{
    padding:10px 13px;
    border-radius:10px;
    color:var(--muted);
    font-size:15px;
    font-weight:700;
    text-decoration:none;
}
.nav-link:hover,.nav-link.active{
    background:rgba(139,92,246,.18);
    color:var(--text);
}
.dashboard-shell{
    width:min(1100px,calc(100% - 32px));
    margin:0 auto;
    padding:48px 0 56px;
}
.hero{
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:28px;
    padding:42px 34px;
    border:1px solid var(--border);
    border-radius:24px;
    background:linear-gradient(135deg,rgba(139,92,246,.23),rgba(38,29,60,.95));
    box-shadow:var(--shadow);
}
.hero::after{
    content:"";
    position:absolute;
    right:-70px;
    bottom:-95px;
    width:260px;
    height:260px;
    border-radius:50%;
    background:rgba(255,255,255,.06);
}
.hero-copy{position:relative;z-index:1;max-width:680px}
.eyebrow{
    margin:0 0 12px;
    color:var(--purple-soft);
    font-size:13px;
    font-weight:800;
    letter-spacing:.12em;
    text-transform:uppercase;
}
.hero h1{
    margin:0;
    font-size:clamp(34px,6vw,58px);
    line-height:1.05;
}
.hero p{
    max-width:650px;
    margin:18px 0 0;
    color:#d7cee6;
    font-size:18px;
    line-height:1.6;
}
.primary-button,.secondary-button{
    position:relative;
    z-index:1;
    min-height:50px;
    padding:0 20px;
    border-radius:14px;
    font-weight:800;
}
.primary-button{
    border:none;
    background:var(--purple);
    color:white;
    box-shadow:0 12px 28px rgba(139,92,246,.28);
}
.secondary-button{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
}
.primary-button:hover{background:#9a6cff;transform:translateY(-1px)}
.panel{
    margin-top:24px;
    padding:26px;
    border:1px solid var(--border);
    border-radius:20px;
    background:var(--panel);
}
.toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    margin-bottom:20px;
}
.section-heading{margin:0;font-size:21px}
.section-subtext{margin:5px 0 0;color:var(--muted);font-size:14px}
.search-box{position:relative;width:min(390px,100%)}
.search-input,.field,.select-field,.text-area{
    width:100%;
    border:1px solid var(--border);
    border-radius:14px;
    outline:none;
    background:var(--card);
    color:var(--text);
}
.search-input,.field,.select-field{min-height:48px;padding:0 16px}
.search-input{padding-right:46px}
.search-input::placeholder,.field::placeholder,.text-area::placeholder{color:#968aa9}
.search-input:focus,.field:focus,.select-field:focus,.text-area:focus{
    border-color:rgba(139,92,246,.8);
    box-shadow:0 0 0 3px rgba(139,92,246,.14);
}
.search-icon{
    position:absolute;
    top:50%;
    right:15px;
    transform:translateY(-50%);
    pointer-events:none;
}
.card-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:16px;
}
.app-card{
    display:flex;
    flex-direction:column;
    min-height:180px;
    padding:22px;
    border:1px solid var(--border);
    border-radius:18px;
    background:var(--card);
    box-shadow:0 12px 28px rgba(0,0,0,.17);
    cursor:pointer;
    transition:.18s ease;
}
.app-card:hover{
    transform:translateY(-2px);
    border-color:rgba(139,92,246,.65);
    background:#2c2146;
}
.card-icon{
    display:grid;
    place-items:center;
    width:42px;
    height:42px;
    margin-bottom:18px;
    border-radius:12px;
    background:rgba(139,92,246,.2);
    font-size:20px;
}
.card-title{margin:0;font-size:19px;line-height:1.3}
.card-role{margin:8px 0 0;color:var(--purple-soft);font-size:14px;font-weight:700}
.card-description{margin:14px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
.empty-state{
    grid-column:1/-1;
    padding:38px 24px;
    border:1px dashed rgba(255,255,255,.18);
    border-radius:18px;
    text-align:center;
    background:rgba(38,29,60,.52);
}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.field-group{display:flex;flex-direction:column;gap:8px}
.field-group.full{grid-column:1/-1}
.field-label{font-size:14px;font-weight:700;color:var(--purple-soft)}
.text-area{min-height:130px;padding:14px;resize:vertical}
.form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:18px}
.back-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-bottom:18px;
    color:var(--purple-soft);
    text-decoration:none;
    font-weight:700;
}
@media(max-width:900px){.card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){
    .app-header{align-items:flex-start;flex-direction:column;padding:16px 18px}
    .navbar{width:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}
    .nav-link{flex:0 0 auto}
    .dashboard-shell{width:min(100% - 24px,1100px);padding-top:24px}
    .hero{align-items:flex-start;flex-direction:column;padding:30px 24px}
    .toolbar{align-items:stretch;flex-direction:column}
    .search-box{width:100%}
}
@media(max-width:560px){
    .hero p{font-size:16px}
    .primary-button,.secondary-button{width:100%}
    .panel{padding:18px}
    .card-grid,.form-grid{grid-template-columns:1fr}
    .field-group.full{grid-column:auto}
    .form-actions{flex-direction:column}
}
</style>
</head>
<body>
<header class="app-header"><div class="logo">📚 <span>Her</span></div><nav class="navbar">
<a class="nav-link" href="world.html">World Bible</a><a class="nav-link" href="artifacts.html">Artifacts</a>
<a class="nav-link active" href="magic.html">Magic</a><a class="nav-link" href="timeline.html">Timeline</a></nav></header>
<main class="dashboard-shell">
<section class="hero"><div class="hero-copy"><p class="eyebrow">World building</p><h1>✨ Magic System</h1><p>Define rules, costs, powers, limits, and forbidden magic.</p></div>
<button class="primary-button" onclick="createMagic()">+ Magic System</button></section>
<section class="panel"><div class="toolbar"><div><h2 class="section-heading">Magic Systems</h2><p class="section-subtext" id="itemTotal">0 systems</p></div></div>
<section class="card-grid" id="magicGrid"></section></section></main>
<script src="../js/config.js"></script><script src="../js/utils/constants.js"></script><script src="../js/utils/helpers.js"></script><script src="../js/storage.js"></script>
<script src="../js/modules/books/books.js"></script><script src="../js/modules/world/magic.js"></script><script src="../js/modules/ui/notifications.js"></script><script src="../js/app.js"></script>
<script>
const book=HerBooks.getCurrent();if(!book)window.location.href="books.html";
function esc(v){return String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");}
function renderMagic(){
 const items=HerMagic.getAll(book.id),grid=document.getElementById("magicGrid");
 document.getElementById("itemTotal").textContent=items.length===1?"1 system":`${items.length} systems`;
 if(!items.length){grid.innerHTML='<div class="empty-state"><h2>No magic systems yet</h2><p>Create one to define your world\'s rules.</p></div>';return;}
 grid.innerHTML=items.map(x=>`<article class="app-card"><div class="card-icon">✨</div><h2 class="card-title">${esc(x.name)}</h2><p class="card-role">Source: ${esc(x.source||"Unknown")}</p><p class="card-description"><strong>Rules:</strong> ${esc(x.rules||"No rules yet.")}<br><br><strong>Limitations:</strong> ${esc(x.limitations||"No limitations yet.")}</p></article>`).join("");
}
function createMagic(){const name=prompt("Magic system name:");if(!name)return;const source=prompt("Source of magic:")||"";HerMagic.create(book.id,{name,source});HerNotifications.success("Magic system created");renderMagic();}
renderMagic();
</script></body></html>
