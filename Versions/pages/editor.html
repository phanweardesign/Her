<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Editor | Her</title>
<link rel="stylesheet" href="../css/main.css">
<style>
:root{
    --bg:#120d1f;
    --panel:#1d1630;
    --card:#261d3c;
    --purple:#8b5cf6;
    --purple-soft:#c9b6ff;
    --text:#ffffff;
    --muted:#b9aecb;
    --border:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}
button,textarea{font:inherit}
.editor-shell{
    display:grid;
    grid-template-columns:270px minmax(0,1fr);
    min-height:100vh;
}
.chapter-list{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    background:var(--panel);
    border-right:1px solid var(--border);
}
.chapter-list-header{
    padding:24px 20px;
    border-bottom:1px solid var(--border);
    font-size:20px;
    font-weight:800;
}
.chapter-items{
    flex:1;
    overflow-y:auto;
    padding:12px;
}
.chapter-item{
    padding:13px 14px;
    border-radius:12px;
    color:var(--muted);
    cursor:pointer;
}
.chapter-item:hover,.chapter-item.active{
    background:rgba(139,92,246,.18);
    color:var(--text);
}
.new-chapter-button{
    min-height:46px;
    margin:12px;
    border:0;
    border-radius:12px;
    background:var(--purple);
    color:#fff;
    font-weight:800;
}
.editor-main{
    display:flex;
    flex-direction:column;
    min-width:0;
    min-height:100vh;
}
.editor-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:20px 24px;
    background:rgba(18,13,31,.96);
    border-bottom:1px solid var(--border);
}
.editor-title{font-size:23px;font-weight:800}
.word-counter{
    display:flex;
    gap:16px;
    margin-top:7px;
    color:var(--muted);
    font-size:14px;
}
.editor-status{
    padding:8px 12px;
    border-radius:999px;
    background:rgba(139,92,246,.16);
    color:var(--purple-soft);
    font-size:13px;
    font-weight:800;
}
.rich-text-toolbar{
    display:flex;
    gap:8px;
    padding:12px 24px;
    overflow-x:auto;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}
.rich-text-btn{
    min-height:40px;
    padding:0 14px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    text-decoration:none;
    display:grid;
    place-items:center;
}
.rich-text-btn:hover{border-color:rgba(139,92,246,.65)}
.editor-writing-area{
    flex:1;
    padding:24px;
    background:
        radial-gradient(circle at top right,rgba(139,92,246,.08),transparent 35%),
        var(--bg);
}
.editor-textarea{
    width:min(900px,100%);
    min-height:calc(100vh - 190px);
    display:block;
    margin:0 auto;
    padding:32px;
    border:1px solid var(--border);
    border-radius:18px;
    outline:none;
    resize:none;
    background:#171124;
    color:var(--text);
    font-size:18px;
    line-height:1.75;
    box-shadow:0 18px 45px rgba(0,0,0,.2);
}
.editor-textarea:focus{
    border-color:rgba(139,92,246,.75);
    box-shadow:0 0 0 3px rgba(139,92,246,.12);
}
.focus-mode .chapter-list,.focus-mode .rich-text-toolbar{display:none}
.focus-mode .editor-shell{grid-template-columns:1fr}
@media(max-width:760px){
    .editor-shell{grid-template-columns:1fr}
    .chapter-list{min-height:auto;border-right:0;border-bottom:1px solid var(--border)}
    .chapter-items{display:flex;overflow-x:auto}
    .chapter-item{flex:0 0 auto}
    .editor-topbar{padding:16px}
    .editor-writing-area{padding:12px}
    .editor-textarea{padding:20px;min-height:65vh}
}
</style>
</head>
<body class="page-editor">
<div class="editor-shell">
    <aside class="chapter-list">
        <div class="chapter-list-header" id="bookTitle">Book</div>
        <div class="chapter-items" id="chapterList"></div>
        <button class="new-chapter-button" type="button" onclick="createChapter()">+ Chapter</button>
    </aside>

    <main class="editor-main">
        <div class="editor-topbar">
            <div>
                <div class="editor-title" id="chapterTitle">Chapter</div>
                <div class="word-counter">
                    <span><strong id="words">0</strong> words</span>
                    <span id="readingTime">1 min read</span>
                </div>
            </div>
            <div class="editor-status" id="saveStatus">Saved</div>
        </div>

        <div class="rich-text-toolbar">
            <button class="rich-text-btn" type="button" onclick="formatText('bold')">B</button>
            <button class="rich-text-btn" type="button" onclick="formatText('italic')">I</button>
            <button class="rich-text-btn" type="button" onclick="toggleFocus()">Focus</button>
            <a class="rich-text-btn" href="chapters.html">Back</a>
        </div>

        <section class="editor-writing-area">
            <textarea class="editor-textarea" id="editorText" placeholder="Start writing..."></textarea>
        </section>
    </main>
</div>

<script src="../js/config.js"></script>
<script src="../js/utils/constants.js"></script>
<script src="../js/utils/helpers.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/modules/books/books.js"></script>
<script src="../js/modules/books/chapters.js"></script>
<script src="../js/modules/books/editor.js"></script>
<script src="../js/modules/books/autosave.js"></script>
<script src="../js/modules/books/wordcount.js"></script>
<script src="../js/modules/ui/notifications.js"></script>
<script src="../js/app.js"></script>
<script>
const book = HerBooks.getCurrent();
if (!book) window.location.href = "books.html";

let currentChapterId = localStorage.getItem(HerConfig.storageKeys.currentChapter);

if (!currentChapterId && book.chapters.length > 0) {
    currentChapterId = book.chapters[0].id;
}

document.getElementById("bookTitle").textContent = book.title;

function esc(value) {
    return String(value || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function renderChapterList() {
    const list = document.getElementById("chapterList");
    const chapters = HerChapters.getAll(book.id);

    list.innerHTML = chapters.map(chapter => `
        <div class="chapter-item ${chapter.id === currentChapterId ? "active" : ""}"
             onclick="switchChapter('${chapter.id}')">
            ${esc(chapter.title || "Untitled Chapter")}
        </div>
    `).join("");
}

function loadChapter() {
    const chapter = HerChapters.getAll(book.id).find(ch => ch.id === currentChapterId);
    if (!chapter) return;

    document.getElementById("chapterTitle").textContent = chapter.title;
    document.getElementById("editorText").value = chapter.content || "";

    updateStats();
    renderChapterList();
}

function switchChapter(chapterId) {
    saveNow();
    currentChapterId = chapterId;
    localStorage.setItem(HerConfig.storageKeys.currentChapter, chapterId);
    loadChapter();
}

function createChapter() {
    const title = prompt("Chapter title:") || "New Chapter";
    HerChapters.create(book.id, title);

    const chapters = HerChapters.getAll(book.id);
    currentChapterId = chapters[chapters.length - 1].id;

    localStorage.setItem(HerConfig.storageKeys.currentChapter, currentChapterId);
    loadChapter();
}

function saveNow() {
    const content = document.getElementById("editorText").value;

    HerChapters.update(book.id, currentChapterId, { content });
    document.getElementById("saveStatus").textContent = "Saved";
}

function updateStats() {
    const text = document.getElementById("editorText").value;
    document.getElementById("words").textContent = HerWordCount.countWords(text);
    document.getElementById("readingTime").textContent = HerWordCount.estimateReadingTime(text);
}

document.getElementById("editorText").addEventListener("input", function() {
    document.getElementById("saveStatus").textContent = "Saving...";
    updateStats();

    HerAutoSave.save(() => {
        saveNow();
    });
});

function formatText(type) {
    HerNotifications.info(`${type} formatting will connect when we add rich text.`);
}

function toggleFocus() {
    document.body.classList.toggle("focus-mode");
}

loadChapter();
</script>
</body>
</html>
