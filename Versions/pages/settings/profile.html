<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profile | Her</title>
<link rel="stylesheet" href="../../css/main.css">

<style>
:root{
    --bg:#120d1f;
    --panel:#1d1630;
    --card:#261d3c;
    --purple:#8b5cf6;
    --purple-soft:#c9b6ff;
    --text:#ffffff;
    --muted:#b9aecb;
    --border:rgba(255,255,255,.09);
    --shadow:0 18px 45px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{
    min-height:100vh;
    margin:0;
    background:
        radial-gradient(circle at top right,rgba(139,92,246,.18),transparent 35%),
        var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app-header{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:18px 28px;
    background:rgba(18,13,31,.94);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(14px);
}
.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:22px;
    font-weight:800;
    white-space:nowrap;
}
.navbar{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    flex-wrap:wrap;
}
.nav-link{
    padding:10px 13px;
    border-radius:10px;
    color:var(--muted);
    font-size:15px;
    font-weight:700;
    text-decoration:none;
}
.nav-link:hover,.nav-link.active{
    background:rgba(139,92,246,.18);
    color:var(--text);
}
.dashboard-shell{
    width:min(1000px,calc(100% - 32px));
    margin:0 auto;
    padding:48px 0 56px;
}
.hero{
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:28px;
    padding:42px 34px;
    border:1px solid var(--border);
    border-radius:24px;
    background:linear-gradient(135deg,rgba(139,92,246,.23),rgba(38,29,60,.95));
    box-shadow:var(--shadow);
}
.hero::after{
    content:"";
    position:absolute;
    right:-70px;
    bottom:-95px;
    width:260px;
    height:260px;
    border-radius:50%;
    background:rgba(255,255,255,.06);
}
.hero-copy{position:relative;z-index:1;max-width:680px}
.eyebrow{
    margin:0 0 12px;
    color:var(--purple-soft);
    font-size:13px;
    font-weight:800;
    letter-spacing:.12em;
    text-transform:uppercase;
}
.hero h1{
    margin:0;
    font-size:clamp(34px,6vw,58px);
    line-height:1.05;
}
.hero p{
    max-width:650px;
    margin:18px 0 0;
    color:#d7cee6;
    font-size:18px;
    line-height:1.6;
}
.panel{
    margin-top:24px;
    padding:26px;
    border:1px solid var(--border);
    border-radius:20px;
    background:var(--panel);
}
.section-heading{margin:0;font-size:21px}
.section-subtext{margin:5px 0 0;color:var(--muted);font-size:14px}
.form-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:16px;
    margin-top:20px;
}
.field-group{
    display:flex;
    flex-direction:column;
    gap:8px;
}
.field-group.full{grid-column:1/-1}
.field-label{
    font-size:14px;
    font-weight:700;
    color:var(--purple-soft);
}
.field,.select-field,.text-area{
    width:100%;
    border:1px solid var(--border);
    border-radius:14px;
    outline:none;
    background:var(--card);
    color:var(--text);
}
.field,.select-field{
    min-height:48px;
    padding:0 16px;
}
.text-area{
    min-height:150px;
    padding:14px;
    resize:vertical;
}
.field:focus,.select-field:focus,.text-area:focus{
    border-color:rgba(139,92,246,.8);
    box-shadow:0 0 0 3px rgba(139,92,246,.14);
}
.setting-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    padding:18px 0;
    border-bottom:1px solid var(--border);
}
.setting-row:last-child{border-bottom:0}
.setting-copy h3{margin:0;font-size:16px}
.setting-copy p{margin:6px 0 0;color:var(--muted);font-size:14px}
.checkbox-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--text);
    font-weight:700;
}
.checkbox-wrap input{
    width:18px;
    height:18px;
}
.form-actions{
    display:flex;
    justify-content:flex-end;
    gap:12px;
    margin-top:22px;
}
.primary-button,.secondary-button,.danger-button{
    min-height:48px;
    padding:0 18px;
    border-radius:14px;
    font-weight:800;
}
.primary-button{
    border:0;
    background:var(--purple);
    color:#fff;
    box-shadow:0 12px 28px rgba(139,92,246,.28);
}
.secondary-button{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
}
.danger-button{
    border:1px solid rgba(255,107,129,.35);
    background:rgba(255,107,129,.12);
    color:#ff9caf;
}
@media(max-width:820px){
    .app-header{align-items:flex-start;flex-direction:column;padding:16px 18px}
    .navbar{width:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}
    .nav-link{flex:0 0 auto}
    .dashboard-shell{width:min(100% - 24px,1000px);padding-top:24px}
    .hero{align-items:flex-start;flex-direction:column;padding:30px 24px}
}
@media(max-width:560px){
    .hero p{font-size:16px}
    .panel{padding:18px}
    .form-grid{grid-template-columns:1fr}
    .field-group.full{grid-column:auto}
    .form-actions{flex-direction:column}
    .primary-button,.secondary-button,.danger-button{width:100%}
    .setting-row{align-items:flex-start;flex-direction:column}
}
</style>

</head>
<body class="page-profile">

<header class="app-header">
    <div class="logo">📚 <span>Her</span></div>

    <nav class="navbar">
        <a class="nav-link" href="../dashboard.html">Dashboard</a>
        <a class="nav-link" href="../books.html">Books</a>
        <a class="nav-link" href="../characters.html">Characters</a>
        <a class="nav-link" href="../world.html">World Bible</a>
        <a class="nav-link active" href="profile.html">Profile</a>
        <a class="nav-link" href="settings.html">Settings</a>
    </nav>
</header>

<main class="dashboard-shell">

    <section class="hero">
        <div class="hero-copy">
            <p class="eyebrow">Local account</p>
            <h1>👤 Profile</h1>
            <p>Manage your local account information and how your name appears inside Her.</p>
        </div>
    </section>

    <section class="panel">
        <div>
            <h2 class="section-heading">Profile Information</h2>
            <p class="section-subtext">Update the information stored on this device.</p>
        </div>

        <div class="form-grid">
            <label class="field-group">
                <span class="field-label">Username</span>
                <input class="field" id="username">
            </label>

            <label class="field-group">
                <span class="field-label">Email</span>
                <input class="field" id="email" type="email">
            </label>

            <label class="field-group full">
                <span class="field-label">Display Name</span>
                <input class="field" id="displayName">
            </label>

            <label class="field-group full">
                <span class="field-label">Bio</span>
                <textarea class="text-area" id="bio"></textarea>
            </label>
        </div>

        <div class="form-actions">
            <button class="danger-button" type="button" onclick="logout()">Logout</button>
            <button class="primary-button" type="button" onclick="saveProfile()">Save Profile</button>
        </div>
    </section>

</main>

<script src="../../js/config.js"></script>
<script src="../../js/utils/constants.js"></script>
<script src="../../js/utils/helpers.js"></script>
<script src="../../js/utils/validation.js"></script>
<script src="../../js/storage.js"></script>
<script src="../../js/modules/auth/session.js"></script>
<script src="../../js/modules/auth/profile.js"></script>
<script src="../../js/modules/ui/notifications.js"></script>
<script src="../../js/app.js"></script>

<script>
let profile = HerProfile.getProfile();

if (!profile) {
    window.location.href = "../login.html";
}

function loadProfile() {
    document.getElementById("username").value = profile.username || "";
    document.getElementById("email").value = profile.email || "";
    document.getElementById("displayName").value = profile.displayName || "";
    document.getElementById("bio").value = profile.bio || "";
}

function saveProfile() {
    const email = getInputValue("#email");

    if (!HerValidation.email(email)) {
        HerNotifications.error("Please enter a valid email.");
        return;
    }

    const result = HerProfile.updateProfile({
        username: getInputValue("#username"),
        email,
        displayName: getInputValue("#displayName"),
        bio: getInputValue("#bio")
    });

    if (result.success) {
        profile = result.user;
        HerNotifications.success("Profile saved");
    } else {
        HerNotifications.error(result.message);
    }
}

function logout() {
    HerSession.logout();
}

loadProfile();
</script>

</body>
</html>
