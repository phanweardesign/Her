<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Profile | Her</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body class="page-character">

<header class="app-header">
    <div class="logo">📚 Her</div>

    <nav class="navbar">
        <a class="nav-link" href="/pages/dashboard.html">Dashboard</a>
        <a class="nav-link" href="/pages/books/books.html">Books</a>
        <a class="nav-link active" href="/pages/characters/characters.html">Characters</a>
        <a class="nav-link" href="/pages/world/world.html">World Bible</a>
    </nav>
</header>

<main class="container section">

    <div class="form-actions" style="justify-content:space-between;">
        <a class="btn btn-secondary" href="/pages/characters/characters.html">Back</a>
        <button class="btn" onclick="saveCharacter()">Save Character</button>
    </div>

    <section class="character-profile" style="margin-top:25px;">

        <aside class="character-details">

            <div class="character-section text-center">

                <div class="character-portrait avatar-lg" style="margin:auto;">
                    <span id="portraitInitial">?</span>
                </div>

                <h1 id="profileTitle" style="margin-top:15px;">Character</h1>

                <p class="card-text" id="profileRole">Role</p>

            </div>

            <div class="character-section">
                <h2>Quick Info</h2>

                <div class="traits" id="traitList">
                    <span class="trait">Draft</span>
                </div>
            </div>

        </aside>

        <section class="character-details">

            <div class="form-section">
                <h2>Basic Information</h2>

                <div class="form-row">
                    <div>
                        <label class="label">Full Name</label>
                        <input class="input" id="name">
                    </div>

                    <div>
                        <label class="label">Nickname</label>
                        <input class="input" id="nickname">
                    </div>
                </div>

                <div class="form-row">
                    <div>
                        <label class="label">Role</label>
                        <select class="select" id="role"></select>
                    </div>

                    <div>
                        <label class="label">Age</label>
                        <input class="input" id="age">
                    </div>
                </div>

                <div>
                    <label class="label">Occupation</label>
                    <input class="input" id="occupation">
                </div>
            </div>

            <div class="form-section">
                <h2>Appearance</h2>
                <textarea class="textarea" id="appearance"></textarea>
            </div>

            <div class="form-section">
                <h2>Personality</h2>
                <textarea class="textarea" id="personality"></textarea>
            </div>

            <div class="form-section">
                <h2>Backstory</h2>
                <textarea class="textarea" id="backstory"></textarea>
            </div>

            <div class="form-section">
                <h2>Goals</h2>
                <textarea class="textarea" id="goals"></textarea>
            </div>

            <div class="form-section">
                <h2>Notes</h2>
                <textarea class="textarea" id="notes"></textarea>
            </div>

            <div class="form-actions">
                <button class="btn btn-danger" onclick="deleteCharacter()">Delete</button>
                <button class="btn" onclick="saveCharacter()">Save</button>
            </div>

        </section>

    </section>

</main>

<script src="/js/config.js"></script>
<script src="/js/utils/constants.js"></script>
<script src="/js/utils/helpers.js"></script>
<script src="/js/storage.js"></script>

<script src="/js/modules/books/books.js"></script>
<script src="/js/modules/characters/characters.js"></script>
<script src="/js/modules/ui/notifications.js"></script>
<script src="/js/app.js"></script>

<script>
const book = HerBooks.getCurrent();
const characterId = localStorage.getItem(HerConfig.storageKeys.currentCharacter);

if (!book || !characterId) {
    window.location.href = "characters.html";
}

let character = HerCharacters.find(book.id, characterId);

if (!character) {
    window.location.href = "characters.html";
}

function loadRoleOptions() {
    const roleSelect = document.getElementById("role");

    roleSelect.innerHTML = HER_CONSTANTS.ROLES.map(role => `
        <option value="${role}">${role}</option>
    `).join("");
}

function loadCharacter() {
    document.getElementById("name").value = character.name || "";
    document.getElementById("nickname").value = character.nickname || "";
    document.getElementById("role").value = character.role || "Supporting Character";
    document.getElementById("age").value = character.age || "";
    document.getElementById("occupation").value = character.occupation || "";
    document.getElementById("appearance").value = character.appearance || "";
    document.getElementById("personality").value = character.personality || "";
    document.getElementById("backstory").value = character.backstory || "";
    document.getElementById("goals").value = character.goals || "";
    document.getElementById("notes").value = character.notes || "";

    document.getElementById("profileTitle").textContent = character.name || "Character";
    document.getElementById("profileRole").textContent = character.role || "Supporting Character";
    document.getElementById("portraitInitial").textContent = (character.name || "?").charAt(0);
}

function saveCharacter() {
    HerCharacters.update(book.id, characterId, {
        name: getInputValue("#name"),
        nickname: getInputValue("#nickname"),
        role: getInputValue("#role"),
        age: getInputValue("#age"),
        occupation: getInputValue("#occupation"),
        appearance: getInputValue("#appearance"),
        personality: getInputValue("#personality"),
        backstory: getInputValue("#backstory"),
        goals: getInputValue("#goals"),
        notes: getInputValue("#notes")
    });

    character = HerCharacters.find(book.id, characterId);
    loadCharacter();

    HerNotifications.success("Character saved");
}

function deleteCharacter() {
    if (!confirm("Delete this character?")) return;

    HerCharacters.delete(book.id, characterId);
    HerNotifications.success("Character deleted");

    setTimeout(() => {
        window.location.href = "characters.html";
    }, 400);
}

loadRoleOptions();
loadCharacter();
</script>

</body>
</html>
```
