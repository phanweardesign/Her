<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books | Her</title>
    <link rel="stylesheet" href="../css/main.css">

    <style>
        :root {
            --dashboard-bg: #120d1f;
            --dashboard-panel: #1d1630;
            --dashboard-card: #261d3c;
            --dashboard-purple: #8b5cf6;
            --dashboard-text: #ffffff;
            --dashboard-muted: #b9aecb;
            --dashboard-border: rgba(255,255,255,.09);
            --dashboard-shadow: 0 18px 45px rgba(0,0,0,.28);
        }

        * {
            box-sizing: border-box;
        }

        body.page-home {
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(139,92,246,.18),
                    transparent 35%
                ),
                var(--dashboard-bg);
            color: var(--dashboard-text);
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app-header {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            width: 100%;
            padding: 18px 28px;
            background: rgba(18,13,31,.94);
            border-bottom: 1px solid var(--dashboard-border);
            backdrop-filter: blur(14px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--dashboard-text);
            font-size: 22px;
            font-weight: 800;
            white-space: nowrap;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }

        .navbar .nav-link {
            padding: 10px 13px;
            border-radius: 10px;
            color: var(--dashboard-muted);
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
        }

        .navbar .nav-link:hover,
        .navbar .nav-link.active {
            background: rgba(139,92,246,.18);
            color: var(--dashboard-text);
        }

        .dashboard-shell {
            width: min(1100px, calc(100% - 32px));
            margin: 0 auto;
            padding: 48px 0 56px;
        }

        .hero {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 28px;
            padding: 42px 34px;
            border: 1px solid var(--dashboard-border);
            border-radius: 24px;
            background:
                linear-gradient(
                    135deg,
                    rgba(139,92,246,.23),
                    rgba(38,29,60,.95)
                );
            box-shadow: var(--dashboard-shadow);
        }

        .hero::after {
            content: "";
            position: absolute;
            right: -70px;
            bottom: -95px;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: rgba(255,255,255,.06);
        }

        .hero-copy {
            position: relative;
            z-index: 1;
            max-width: 680px;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #c9b6ff;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .hero h1 {
            margin: 0;
            color: var(--dashboard-text);
            font-size: clamp(34px, 6vw, 58px);
            line-height: 1.05;
        }

        .hero .card-text {
            max-width: 650px;
            margin: 18px 0 0;
            color: #d7cee6;
            font-size: 18px;
            line-height: 1.6;
        }

        .new-book-button {
            position: relative;
            z-index: 1;
            min-height: 50px;
            padding: 0 20px;
            border: none;
            border-radius: 14px;
            background: var(--dashboard-purple);
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            box-shadow: 0 12px 28px rgba(139,92,246,.28);
        }

        .new-book-button:hover {
            background: #9a6cff;
            transform: translateY(-1px);
        }

        .library-panel {
            margin-top: 24px;
            padding: 26px;
            border: 1px solid var(--dashboard-border);
            border-radius: 20px;
            background: var(--dashboard-panel);
        }

        .library-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 20px;
        }

        .section-heading {
            margin: 0;
            color: var(--dashboard-text);
            font-size: 21px;
        }

        .book-total {
            margin: 5px 0 0;
            color: var(--dashboard-muted);
            font-size: 14px;
        }

        .search-box {
            position: relative;
            width: min(390px, 100%);
        }

        .search-input {
            width: 100%;
            min-height: 48px;
            padding: 0 46px 0 16px;
            border: 1px solid var(--dashboard-border);
            border-radius: 14px;
            outline: none;
            background: var(--dashboard-card);
            color: var(--dashboard-text);
        }

        .search-input::placeholder {
            color: #968aa9;
        }

        .search-input:focus {
            border-color: rgba(139,92,246,.8);
            box-shadow: 0 0 0 3px rgba(139,92,246,.14);
        }

        .search-icon {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        .book-card {
            display: flex;
            flex-direction: column;
            min-height: 190px;
            padding: 22px;
            border: 1px solid var(--dashboard-border);
            border-radius: 18px;
            background: var(--dashboard-card);
            color: var(--dashboard-text);
            box-shadow: 0 12px 28px rgba(0,0,0,.17);
            cursor: pointer;
            transition:
                transform .18s ease,
                border-color .18s ease,
                background .18s ease;
        }

        .book-card:hover {
            transform: translateY(-2px);
            border-color: rgba(139,92,246,.65);
            background: #2c2146;
        }

        .book-icon {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            margin-bottom: 20px;
            border-radius: 12px;
            background: rgba(139,92,246,.2);
            font-size: 20px;
        }

        .book-title {
            margin: 0;
            color: var(--dashboard-text);
            font-size: 19px;
            line-height: 1.3;
        }

        .book-genre {
            margin: 8px 0 0;
            color: #c9b6ff;
            font-size: 14px;
            font-weight: 700;
        }

        .book-meta {
            margin: auto 0 0;
            padding-top: 22px;
            color: var(--dashboard-muted);
            font-size: 14px;
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 38px 24px;
            border: 1px dashed rgba(255,255,255,.18);
            border-radius: 18px;
            text-align: center;
            background: rgba(38,29,60,.52);
        }

        .empty-state h2 {
            margin: 0 0 8px;
            color: var(--dashboard-text);
            font-size: 20px;
        }

        .empty-state p {
            margin: 0;
            color: var(--dashboard-muted);
            line-height: 1.5;
        }

        @media (max-width: 900px) {
            .book-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 820px) {
            .app-header {
                align-items: flex-start;
                flex-direction: column;
                padding: 16px 18px;
            }

            .navbar {
                width: 100%;
                justify-content: flex-start;
                overflow-x: auto;
                flex-wrap: nowrap;
            }

            .navbar .nav-link {
                flex: 0 0 auto;
            }

            .dashboard-shell {
                width: min(100% - 24px, 1100px);
                padding-top: 24px;
            }

            .hero {
                align-items: flex-start;
                flex-direction: column;
                padding: 30px 24px;
            }

            .library-toolbar {
                align-items: stretch;
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }
        }

        @media (max-width: 560px) {
            .hero .card-text {
                font-size: 16px;
            }

            .new-book-button {
                width: 100%;
            }

            .library-panel {
                padding: 18px;
            }

            .book-grid {
                grid-template-columns: 1fr;
            }

            .book-card {
                min-height: 165px;
            }
        }
    </style>
</head>

<body class="page-home">

<header class="app-header">
    <div class="logo">
        <span aria-hidden="true">📚</span>
        <span>Her</span>
    </div>

    <nav class="navbar" data-her-navigation></nav>
</header>

<main class="dashboard-shell">

    <section class="hero">
        <div class="hero-copy">
            <p class="eyebrow">Your writing library</p>
            <h1>Your Books</h1>
            <p class="card-text">
                Create a new manuscript or continue working on one
                of your existing stories.
            </p>
        </div>

        <button
            class="new-book-button"
            type="button"
            onclick="createBook()"
        >
            + New Book
        </button>
    </section>

    <section class="library-panel">

        <div class="library-toolbar">
            <div>
                <h2 class="section-heading">Book Library</h2>
                <p class="book-total" id="bookTotal">0 books</p>
            </div>

            <div class="search-box">
                <input
                    class="search-input"
                    id="searchInput"
                    type="search"
                    placeholder="Search books..."
                    autocomplete="off"
                >
                <span class="search-icon" aria-hidden="true">🔍</span>
            </div>
        </div>

        <section
            class="book-grid"
            id="bookGrid"
            aria-live="polite"
        ></section>

    </section>

</main>

<script src="../js/navigation.js"></script>
<script src="../js/config.js"></script>
<script src="../js/utils/constants.js"></script>
<script src="../js/utils/helpers.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/modules/books/books.js"></script>
<script src="../js/modules/books/search.js"></script>
<script src="../js/modules/ui/notifications.js"></script>
<script src="../js/app.js"></script>

<script>
    function escapeHtml(value) {
        return String(value || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function updateBookTotal(count) {
        const total = document.getElementById("bookTotal");

        total.textContent =
            count === 1
                ? "1 book"
                : `${count} books`;
    }

    function renderBooks(list = HerBooks.getAll()) {
        const grid = document.getElementById("bookGrid");
        const books = Array.isArray(list) ? list : [];

        updateBookTotal(books.length);

        if (books.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <h2>No books yet</h2>
                    <p>Create your first book to begin writing.</p>
                </div>
            `;
            return;
        }

        grid.innerHTML = books.map((book) => {
            const chapters =
                Array.isArray(book.chapters)
                    ? book.chapters.length
                    : 0;

            return `
                <article
                    class="book-card"
                    role="button"
                    tabindex="0"
                    onclick="openBook('${book.id}')"
                    onkeydown="handleBookKey(event, '${book.id}')"
                >
                    <div class="book-icon" aria-hidden="true">📖</div>

                    <h2 class="book-title">
                        ${escapeHtml(book.title || "Untitled Book")}
                    </h2>

                    <p class="book-genre">
                        ${escapeHtml(book.genre || "No genre yet")}
                    </p>

                    <p class="book-meta">
                        ${chapters}
                        ${chapters === 1 ? "chapter" : "chapters"}
                    </p>
                </article>
            `;
        }).join("");
    }

    function createBook() {
        const title = prompt("Book title:");

        if (!title || !title.trim()) {
            return;
        }

        const genre = prompt("Genre:") || "";
        const book = HerBooks.create(
            title.trim(),
            genre.trim()
        );

        HerNotifications.success("Book created");
        openBook(book.id);
    }

    function openBook(bookId) {
        HerBooks.setCurrent(bookId);
        window.location.href = "chapters.html";
    }

    function handleBookKey(event, bookId) {
        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openBook(bookId);
        }
    }

    document
        .getElementById("searchInput")
        .addEventListener("input", function () {
            renderBooks(
                HerBookSearch.searchBooks(this.value)
            );
        });

    renderBooks();
</script>

</body>
</html>
