<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Her</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body class="auth-page">

<main class="auth-card">
    <div class="text-center">
        <h1>Forgot Password</h1>
        <p class="card-text">Enter your email and we’ll help you reset your password.</p>
    </div>

    <form class="form" id="forgotPasswordForm">
        <div>
            <label class="label label-required">Email</label>
            <input class="input" id="email" type="email" required>
        </div>

        <button class="btn" type="submit">Send Reset Link</button>
    </form>

    <div class="text-center">
        <p><a href="/pages/auth/login.html">Back to Login</a></p>
    </div>
</main>

<script src="/js/config.js"></script>
<script src="/js/utils/helpers.js"></script>
<script src="/js/utils/validation.js"></script>
<script src="/js/modules/ui/notifications.js"></script>
<script src="/js/app.js"></script>

<script>
document.getElementById("forgotPasswordForm").addEventListener("submit", function(e){
    e.preventDefault();

    const email = getInputValue("#email");

    if (!HerValidation.email(email)) {
        HerNotifications.error("Please enter a valid email.");
        return;
    }

    HerNotifications.success("Reset link feature is ready for backend connection.");
});
</script>

</body>
</html>
