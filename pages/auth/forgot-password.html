<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Her</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body class="auth-page">

<main class="auth-card">
    <div class="text-center">
        <h1>Forgot Password</h1>
        <p class="card-text">Enter your account email and we’ll send a six-digit reset code.</p>
    </div>

    <form class="form" id="forgotPasswordForm">
        <div>
            <label class="label label-required" for="email">Email</label>
            <input class="input" id="email" type="email" autocomplete="email" required>
        </div>

        <button class="btn" id="sendButton" type="submit">Send Reset Code</button>
    </form>

    <p id="statusMessage" class="card-text text-center" aria-live="polite"></p>

    <div class="text-center">
        <p><a href="login.html">Back to Login</a></p>
    </div>
</main>

<script>
const form = document.getElementById("forgotPasswordForm");
const emailInput = document.getElementById("email");
const sendButton = document.getElementById("sendButton");
const statusMessage = document.getElementById("statusMessage");

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = emailInput.value.trim().toLowerCase();
    if (!/^\S+@\S+\.\S+$/.test(email)) {
        statusMessage.textContent = "Enter a valid email address.";
        return;
    }

    sendButton.disabled = true;
    sendButton.textContent = "Sending...";
    statusMessage.textContent = "";

    try {
        const response = await fetch("/api/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
            throw new Error(data.message || "Unable to send the reset code.");
        }

        sessionStorage.setItem("her_reset_email", email);
        window.location.href = `reset-password.html?email=${encodeURIComponent(email)}`;
    } catch (error) {
        statusMessage.textContent = error.message;
        sendButton.disabled = false;
        sendButton.textContent = "Send Reset Code";
    }
});
</script>

</body>
</html>
