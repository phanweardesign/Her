<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Her</title>
    <link rel="stylesheet" href="../../css/main.css">
    <style>
        .reset-code-input { letter-spacing: .35em; text-align: center; font-size: 1.35rem; }
        .reset-actions { display: grid; gap: .75rem; }
        .timer { text-align: center; font-weight: 700; }
        .btn-secondary { background: transparent; color: #5B3FD6; border: 1px solid #5B3FD6; }
    </style>
</head>
<body class="auth-page">

<main class="auth-card">
    <div class="text-center">
        <h1>Reset Password</h1>
        <p class="card-text">Enter the six-digit code from your email. The code is valid for one minute.</p>
    </div>

    <form class="form" id="resetPasswordForm">
        <div>
            <label class="label label-required" for="email">Email</label>
            <input class="input" id="email" type="email" autocomplete="email" required>
        </div>

        <div>
            <label class="label label-required" for="code">Reset Code</label>
            <input class="input reset-code-input" id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
        </div>

        <p id="timer" class="timer" aria-live="polite">Code expires in 1:00</p>

        <div>
            <label class="label label-required" for="password">New Password</label>
            <input class="input" id="password" type="password" autocomplete="new-password" minlength="8" required>
        </div>

        <div>
            <label class="label label-required" for="confirmPassword">Confirm Password</label>
            <input class="input" id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
        </div>

        <div class="reset-actions">
            <button class="btn" id="resetButton" type="submit">Reset Password</button>
            <button class="btn btn-secondary" id="resendButton" type="button" disabled>Resend Code (60)</button>
        </div>
    </form>

    <p id="statusMessage" class="card-text text-center" aria-live="polite"></p>

    <div class="text-center">
        <p><a href="login.html">Back to Login</a></p>
    </div>
</main>

<script>
const form = document.getElementById("resetPasswordForm");
const emailInput = document.getElementById("email");
const codeInput = document.getElementById("code");
const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirmPassword");
const resetButton = document.getElementById("resetButton");
const resendButton = document.getElementById("resendButton");
const timer = document.getElementById("timer");
const statusMessage = document.getElementById("statusMessage");

const queryEmail = new URLSearchParams(window.location.search).get("email");
emailInput.value = queryEmail || sessionStorage.getItem("her_reset_email") || "";

let secondsRemaining = 60;
let countdownId;

function startCountdown(seconds = 60) {
    clearInterval(countdownId);
    secondsRemaining = seconds;
    resendButton.disabled = true;

    const update = () => {
        const minutes = Math.floor(secondsRemaining / 60);
        const secondsPart = String(secondsRemaining % 60).padStart(2, "0");
        timer.textContent = secondsRemaining > 0
            ? `Code expires in ${minutes}:${secondsPart}`
            : "Code expired. Request a new code.";
        resendButton.textContent = secondsRemaining > 0
            ? `Resend Code (${secondsRemaining})`
            : "Resend Code";

        if (secondsRemaining <= 0) {
            clearInterval(countdownId);
            resendButton.disabled = false;
            return;
        }
        secondsRemaining -= 1;
    };

    update();
    countdownId = setInterval(update, 1000);
}

startCountdown();

codeInput.addEventListener("input", () => {
    codeInput.value = codeInput.value.replace(/\D/g, "").slice(0, 6);
});

resendButton.addEventListener("click", async () => {
    const email = emailInput.value.trim().toLowerCase();
    if (!/^\S+@\S+\.\S+$/.test(email)) {
        statusMessage.textContent = "Enter a valid email address.";
        return;
    }

    resendButton.disabled = true;
    statusMessage.textContent = "Sending a new code...";

    try {
        const response = await fetch("/api/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            if (response.status === 429 && data.retryAfterSeconds) {
                startCountdown(data.retryAfterSeconds);
            }
            throw new Error(data.message || "Unable to resend the code.");
        }

        codeInput.value = "";
        statusMessage.textContent = "A new code was sent.";
        startCountdown(60);
    } catch (error) {
        statusMessage.textContent = error.message;
        if (secondsRemaining <= 0) resendButton.disabled = false;
    }
});

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = emailInput.value.trim().toLowerCase();
    const code = codeInput.value.trim();
    const password = passwordInput.value;
    const confirmPassword = confirmPasswordInput.value;

    if (!/^\S+@\S+\.\S+$/.test(email)) {
        statusMessage.textContent = "Enter a valid email address.";
        return;
    }
    if (!/^\d{6}$/.test(code)) {
        statusMessage.textContent = "Enter the six-digit reset code.";
        return;
    }
    if (password.length < 8) {
        statusMessage.textContent = "Password must be at least 8 characters.";
        return;
    }
    if (password !== confirmPassword) {
        statusMessage.textContent = "Passwords do not match.";
        return;
    }

    resetButton.disabled = true;
    resetButton.textContent = "Resetting...";
    statusMessage.textContent = "";

    try {
        const response = await fetch("/api/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, code, password })
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(data.message || "Unable to reset the password.");
        }

        sessionStorage.removeItem("her_reset_email");
        alert("Password reset successfully. Log in with your new password.");
        window.location.href = "login.html";
    } catch (error) {
        statusMessage.textContent = error.message;
        resetButton.disabled = false;
        resetButton.textContent = "Reset Password";
    }
});
</script>

</body>
</html>
