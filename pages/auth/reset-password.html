<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Her</title>
    <link rel="stylesheet" href="../../css/main.css">
    <style>
        .reset-code-input { letter-spacing: .35em; text-align: center; font-size: 1.35rem; }
        .reset-actions { display: grid; gap: .75rem; }
        .timer { text-align: center; font-weight: 700; }
        .btn-secondary { background: transparent; color: #5B3FD6; border: 1px solid #5B3FD6; }
    </style>
</head>
<body class="auth-page">

<main class="auth-card">
    <div class="text-center">
        <h1>Reset Password</h1>
        <p class="card-text">Enter the six-digit code from your email. The code is valid for 15 minutes.</p>
    </div>

    <form class="form" id="resetPasswordForm">
        <div>
            <label class="label label-required" for="email">Email</label>
            <input class="input" id="email" type="email" autocomplete="email" required>
        </div>

        <div>
            <label class="label label-required" for="code">Reset Code</label>
            <input class="input reset-code-input" id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
        </div>

        <p id="timer" class="timer" aria-live="polite">Code expires in 15:00</p>

        <div>
            <label class="label label-required" for="password">New Password</label>
            <input class="input" id="password" type="password" autocomplete="new-password" minlength="8" required>
        </div>

        <div>
            <label class="label label-required" for="confirmPassword">Confirm Password</label>
            <input class="input" id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
        </div>

        <div class="reset-actions">
            <button class="btn" id="resetButton" type="submit">Reset Password</button>
            <button class="btn btn-secondary" id="resendButton" type="button" disabled>Resend Code (30)</button>
        </div>
    </form>

    <p id="statusMessage" class="card-text text-center" aria-live="polite"></p>

    <div class="text-center">
        <p><a href="login.html">Back to Login</a></p>
    </div>
</main>

<script>
const form = document.getElementById("resetPasswordForm");
const emailInput = document.getElementById("email");
const codeInput = document.getElementById("code");
const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirmPassword");
const resetButton = document.getElementById("resetButton");
const resendButton = document.getElementById("resendButton");
const timer = document.getElementById("timer");
const statusMessage = document.getElementById("statusMessage");

const queryEmail = new URLSearchParams(window.location.search).get("email");
emailInput.value = queryEmail || sessionStorage.getItem("her_reset_email") || "";

let codeExpiresAt = Number(sessionStorage.getItem("her_reset_expires_at")) || (Date.now() + 15 * 60 * 1000);
let resendAvailableAt = Number(sessionStorage.getItem("her_reset_resend_at")) || (Date.now() + 30 * 1000);
let countdownId;

function formatTime(totalSeconds) {
    const safeSeconds = Math.max(0, totalSeconds);
    const minutes = Math.floor(safeSeconds / 60);
    const seconds = String(safeSeconds % 60).padStart(2, "0");
    return `${minutes}:${seconds}`;
}

function updateCountdowns() {
    const now = Date.now();
    const codeSeconds = Math.ceil((codeExpiresAt - now) / 1000);
    const resendSeconds = Math.ceil((resendAvailableAt - now) / 1000);

    timer.textContent = codeSeconds > 0
        ? `Code expires in ${formatTime(codeSeconds)}`
        : "Code expired. Request a new code.";

    resendButton.disabled = resendSeconds > 0;
    resendButton.textContent = resendSeconds > 0
        ? `Resend Code (${resendSeconds})`
        : "Resend Code";
}

function startCountdowns() {
    clearInterval(countdownId);
    updateCountdowns();
    countdownId = setInterval(updateCountdowns, 1000);
}

startCountdowns();

codeInput.addEventListener("input", () => {
    codeInput.value = codeInput.value.replace(/\D/g, "").slice(0, 6);
});

resendButton.addEventListener("click", async () => {
    const email = emailInput.value.trim().toLowerCase();
    if (!/^\S+@\S+\.\S+$/.test(email)) {
        statusMessage.textContent = "Enter a valid email address.";
        return;
    }

    resendButton.disabled = true;
    statusMessage.textContent = "Sending a new code...";

    try {
        const response = await fetch("/api/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            if (response.status === 429 && data.retryAfterSeconds) {
                resendAvailableAt = Date.now() + Number(data.retryAfterSeconds) * 1000;
                sessionStorage.setItem("her_reset_resend_at", String(resendAvailableAt));
                startCountdowns();
            }
            throw new Error(data.message || "Unable to resend the code.");
        }

        const now = Date.now();
        const expiresInSeconds = Number(data.expiresInSeconds) || 900;
        const resendAfterSeconds = Number(data.resendAfterSeconds) || 30;

        codeExpiresAt = now + expiresInSeconds * 1000;
        resendAvailableAt = now + resendAfterSeconds * 1000;
        sessionStorage.setItem("her_reset_expires_at", String(codeExpiresAt));
        sessionStorage.setItem("her_reset_resend_at", String(resendAvailableAt));

        codeInput.value = "";
        statusMessage.textContent = "A new code was sent.";
        startCountdowns();
    } catch (error) {
        statusMessage.textContent = error.message;
        updateCountdowns();
    }
});

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = emailInput.value.trim().toLowerCase();
    const code = codeInput.value.trim();
    const password = passwordInput.value;
    const confirmPassword = confirmPasswordInput.value;

    if (!/^\S+@\S+\.\S+$/.test(email)) {
        statusMessage.textContent = "Enter a valid email address.";
        return;
    }
    if (!/^\d{6}$/.test(code)) {
        statusMessage.textContent = "Enter the six-digit reset code.";
        return;
    }
    if (password.length < 8) {
        statusMessage.textContent = "Password must be at least 8 characters.";
        return;
    }
    if (password !== confirmPassword) {
        statusMessage.textContent = "Passwords do not match.";
        return;
    }

    resetButton.disabled = true;
    resetButton.textContent = "Resetting...";
    statusMessage.textContent = "";

    try {
        const response = await fetch("/api/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, code, password })
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(data.message || "Unable to reset the password.");
        }

        sessionStorage.removeItem("her_reset_email");
        sessionStorage.removeItem("her_reset_expires_at");
        sessionStorage.removeItem("her_reset_resend_at");
        alert("Password reset successfully. Log in with your new password.");
        window.location.href = "login.html";
    } catch (error) {
        statusMessage.textContent = error.message;
        resetButton.disabled = false;
        resetButton.textContent = "Reset Password";
    }
});
</script>

</body>
</html>
