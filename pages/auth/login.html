<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Her</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#faf8f2;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:90%;
            max-width:420px;
            background:#fff;
            padding:30px;
            border-radius:18px;
            box-shadow:0 10px 30px rgba(0,0,0,.12);
        }

        h1{
            text-align:center;
            color:#5B3FD6;
            margin-bottom:10px;
        }

        p{
            text-align:center;
            color:#666;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:14px;
            margin:10px 0;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:16px;
            outline:none;
        }

        input:focus{
            border-color:#5B3FD6;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:12px;
            background:#5B3FD6;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:.25s;
        }

        button:hover{
            background:#4729c5;
        }

        button:disabled{
            opacity:.7;
            cursor:not-allowed;
        }

        .footer{
            text-align:center;
            margin-top:18px;
            color:#777;
        }

        .footer a{
            color:#5B3FD6;
            text-decoration:none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Welcome Back</h1>
    <p>Continue writing your story</p>

    <form id="loginForm">

        <input
            id="identifier"
            type="text"
            placeholder="Username or Email"
            required
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
            required
        >

        <button id="loginButton" type="submit">
            Login
        </button>

    </form>

    <div class="footer" style="margin-top:12px;">
        <a href="forgot-password.html">Forgot password?</a>
    </div>

    <div class="footer">
        Don't have an account?
        <a href="signup.html">Sign up</a>
    </div>

</div>

<script>

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");

form.addEventListener("submit", async (e)=>{

    e.preventDefault();

    button.disabled = true;
    button.textContent = "Logging In...";

    try{

        const response = await fetch("/api/auth/login",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                identifier:
                    document.getElementById("identifier").value.trim(),

                password:
                    document.getElementById("password").value

            })

        });

        const data = await response.json().catch(() => ({}));

        if(!response.ok){

            alert(data.message || "Login failed.");

            button.disabled = false;
            button.textContent = "Login";

            return;
        }

        localStorage.setItem("her_user", JSON.stringify(data.user));
        localStorage.setItem("her_auth_token", data.token || "");

        window.location.href="../dashboard.html";

    }
    catch(err){

        console.error(err);

        alert("Unable to connect to the server.");

        button.disabled=false;
        button.textContent="Login";

    }

});

</script>

<script src="../../js/storage.js"></script>

</body>
</html>
