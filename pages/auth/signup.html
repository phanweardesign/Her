<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Her</title>

    <link rel="stylesheet" href="../../css/main.css">
</head>

<body class="auth-page">

    <main class="auth-card">

        <div class="text-center">
            <h1>Create Account</h1>
            <p class="card-text">Start building your writing world.</p>
        </div>

        <form class="form" id="signupForm">

            <div>
                <label class="label label-required">Username</label>
                <input class="input" id="username" type="text" required>
            </div>

            <div>
                <label class="label label-required">Email</label>
                <input class="input" id="email" type="email" required>
            </div>

            <div>
                <label class="label label-required">Phone Number</label>
                <input class="input" id="phone" type="tel" required>
            </div>

            <div>
                <label class="label label-required">Password</label>
                <input class="input" id="password" type="password" required>

                <div class="password-strength">
                    <div class="password-strength-bar">
                        <div class="password-strength-fill" id="strengthFill"></div>
                    </div>
                    <div class="password-strength-text" id="strengthText">
                        Password strength
                    </div>
                </div>
            </div>

            <div>
                <label class="label label-required">Confirm Password</label>
                <input class="input" id="confirmPassword" type="password" required>
            </div>

            <label class="checkbox-line">
                <input type="checkbox" id="termsCheck" required>
                <span>
                    I agree to the
                    <a href="../terms.html" target="_blank">Terms of Service</a>
                </span>
            </label>

            <label class="checkbox-line">
                <input type="checkbox" id="privacyCheck" required>
                <span>
                    I agree to the
                    <a href="../privacy.html" target="_blank">Privacy Policy</a>
                </span>
            </label>

            <button class="btn" id="signupBtn" type="submit">
                <span id="btnText">Create Account</span>
                <span id="spinner" style="display:none;"> ⏳</span>
            </button>

        </form>

        <div class="text-center">
            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </div>

    </main>
    <script src="../js/storage.js"></script>
    <script>
        const API_URL = "/api/auth/signup";

        const signupForm = document.getElementById("signupForm");
        const signupBtn = document.getElementById("signupBtn");
        const btnText = document.getElementById("btnText");
        const spinner = document.getElementById("spinner");

        const passwordInput = document.getElementById("password");
        const strengthFill = document.getElementById("strengthFill");
        const strengthText = document.getElementById("strengthText");

        passwordInput.addEventListener("input", function () {
            const value = passwordInput.value;

            strengthFill.className = "password-strength-fill";

            if (value.length >= 12) {
                strengthFill.classList.add("strong");
                strengthText.textContent = "Strong password";
            } else if (value.length >= 8) {
                strengthFill.classList.add("medium");
                strengthText.textContent = "Medium password";
            } else if (value.length > 0) {
                strengthFill.classList.add("weak");
                strengthText.textContent = "Weak password";
            } else {
                strengthText.textContent = "Password strength";
            }
        });

        signupForm.addEventListener("submit", async function (e) {
            e.preventDefault();

            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const termsCheck = document.getElementById("termsCheck").checked;
            const privacyCheck = document.getElementById("privacyCheck").checked;

            if (!username || !email || !phone || !password || !confirmPassword) {
                alert("Please fill out all fields.");
                return;
            }

            if (!termsCheck) {
                alert("You must agree to the Terms of Service.");
                return;
            }

            if (!privacyCheck) {
                alert("You must agree to the Privacy Policy.");
                return;
            }

            if (password.length < 8) {
                alert("Password must be at least 8 characters.");
                return;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return;
            }

            try {
                signupBtn.disabled = true;
                btnText.textContent = "Creating Account...";
                spinner.style.display = "inline";

            const response = await fetch("/api/auth/signup", {

                        username,
                        email,
                        phone,
                        password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.message || "Signup failed.");
                    return;
                }

                alert("Account created successfully! Redirecting to login...");

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1000);

            } catch (error) {
                console.error(error);
                alert("Could not connect to backend. Make sure your server is running.");
            } finally {
                signupBtn.disabled = false;
                btnText.textContent = "Create Account";
                spinner.style.display = "none";
            }
        });
    </script>

</body>
</html>
