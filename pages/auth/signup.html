<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Her</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="text-center">
            <h1>Create Account</h1>
            <p class="card-text">Start building your writing world.</p>
        </div>

        <form class="form" id="signupForm">
            <div>
                <label class="label label-required" for="username">
                    Username
                </label>
                <input
                    class="input"
                    id="username"
                    type="text"
                    autocomplete="username"
                    required
                >
            </div>

            <div>
                <label class="label label-required" for="email">
                    Email
                </label>
                <input
                    class="input"
                    id="email"
                    type="email"
                    autocomplete="email"
                    required
                >
            </div>

            <div>
                <label class="label label-required" for="phone">
                    Phone Number
                </label>
                <input
                    class="input"
                    id="phone"
                    type="tel"
                    autocomplete="tel"
                    required
                >
            </div>

            <div>
                <label class="label label-required" for="password">
                    Password
                </label>
                <input
                    class="input"
                    id="password"
                    type="password"
                    autocomplete="new-password"
                    required
                >

                <div class="password-strength">
                    <div class="password-strength-bar">
                        <div
                            class="password-strength-fill"
                            id="strengthFill"
                        ></div>
                    </div>
                    <div
                        class="password-strength-text"
                        id="strengthText"
                    >
                        Password strength
                    </div>
                </div>
            </div>

            <div>
                <label
                    class="label label-required"
                    for="confirmPassword"
                >
                    Confirm Password
                </label>
                <input
                    class="input"
                    id="confirmPassword"
                    type="password"
                    autocomplete="new-password"
                    required
                >
            </div>

            <label class="checkbox-line">
                <input type="checkbox" id="termsCheck" required>
                <span>
                    I agree to the
                    <a
                        href="/pages/legal/terms.html"
                        target="_blank"
                    >
                        Terms of Service
                    </a>
                </span>
            </label>

            <label class="checkbox-line">
                <input type="checkbox" id="privacyCheck" required>
                <span>
                    I agree to the
                    <a
                        href="/pages/legal/privacy.html"
                        target="_blank"
                    >
                        Privacy Policy
                    </a>
                </span>
            </label>

            <button class="btn" id="signupButton" type="submit">
                Create Account
            </button>
        </form>

        <div class="text-center">
            <p>
                Already have an account?
                <a href="/pages/auth/login.html">Login</a>
            </p>
        </div>
    </main>

    <script src="/js/config.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/services/apiService.js"></script>
    <script src="/js/services/authService.js"></script>
    <script src="/js/app.js"></script>

    <script>
        const signupForm = document.getElementById("signupForm");
        const signupButton = document.getElementById("signupButton");
        const passwordInput = document.getElementById("password");
        const strengthFill = document.getElementById("strengthFill");
        const strengthText = document.getElementById("strengthText");

        passwordInput.addEventListener("input", () => {
            const length = passwordInput.value.length;
            strengthFill.className = "password-strength-fill";

            if (length >= 12) {
                strengthFill.classList.add("strong");
                strengthText.textContent = "Strong password";
            } else if (length >= 8) {
                strengthFill.classList.add("medium");
                strengthText.textContent = "Medium password";
            } else if (length > 0) {
                strengthFill.classList.add("weak");
                strengthText.textContent = "Weak password";
            } else {
                strengthText.textContent = "Password strength";
            }
        });

        signupForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const phone =
                document.getElementById("phone").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password.length < 8) {
                alert("Password must be at least 8 characters.");
                return;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return;
            }

            signupButton.disabled = true;
            signupButton.textContent = "Creating Account...";

            try {
                const result = await HerAuthService.signup(
                    username,
                    email,
                    phone,
                    password
                );

                if (!result.success) {
                    alert(result.message || "Signup failed.");
                    return;
                }

                alert("Account created successfully.");
                window.location.href = "/pages/auth/login.html";
            } catch (error) {
                console.error("Signup error:", error);
                alert(error.message || "Unable to create account.");
            } finally {
                signupButton.disabled = false;
                signupButton.textContent = "Create Account";
            }
        });
    </script>
</body>
</html>
