<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Character Profile | Her</title>
<link rel="stylesheet" href="../css/main.css">

<style>
:root{
    --bg:#120d1f;
    --panel:#1d1630;
    --card:#261d3c;
    --purple:#8b5cf6;
    --purple-soft:#c9b6ff;
    --text:#ffffff;
    --muted:#b9aecb;
    --border:rgba(255,255,255,.09);
    --shadow:0 18px 45px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{
    min-height:100vh;
    margin:0;
    background:
        radial-gradient(circle at top right,rgba(139,92,246,.18),transparent 35%),
        var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app-header{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:18px 28px;
    background:rgba(18,13,31,.94);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(14px);
}
.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:22px;
    font-weight:800;
    white-space:nowrap;
}
.navbar{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    flex-wrap:wrap;
}
.nav-link{
    padding:10px 13px;
    border-radius:10px;
    color:var(--muted);
    font-size:15px;
    font-weight:700;
    text-decoration:none;
}
.nav-link:hover,.nav-link.active{
    background:rgba(139,92,246,.18);
    color:var(--text);
}
.dashboard-shell{
    width:min(1100px,calc(100% - 32px));
    margin:0 auto;
    padding:48px 0 56px;
}
.hero{
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:28px;
    padding:42px 34px;
    border:1px solid var(--border);
    border-radius:24px;
    background:linear-gradient(135deg,rgba(139,92,246,.23),rgba(38,29,60,.95));
    box-shadow:var(--shadow);
}
.hero::after{
    content:"";
    position:absolute;
    right:-70px;
    bottom:-95px;
    width:260px;
    height:260px;
    border-radius:50%;
    background:rgba(255,255,255,.06);
}
.hero-copy{position:relative;z-index:1;max-width:680px}
.eyebrow{
    margin:0 0 12px;
    color:var(--purple-soft);
    font-size:13px;
    font-weight:800;
    letter-spacing:.12em;
    text-transform:uppercase;
}
.hero h1{
    margin:0;
    font-size:clamp(34px,6vw,58px);
    line-height:1.05;
}
.hero p{
    max-width:650px;
    margin:18px 0 0;
    color:#d7cee6;
    font-size:18px;
    line-height:1.6;
}
.primary-button,.secondary-button,.danger-button{
    position:relative;
    z-index:1;
    min-height:48px;
    padding:0 18px;
    border-radius:14px;
    font-weight:800;
}
.primary-button{
    border:0;
    background:var(--purple);
    color:#fff;
    box-shadow:0 12px 28px rgba(139,92,246,.28);
}
.secondary-button{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
}
.danger-button{
    border:1px solid rgba(255,107,129,.35);
    background:rgba(255,107,129,.12);
    color:#ff9caf;
}
.panel{
    margin-top:24px;
    padding:26px;
    border:1px solid var(--border);
    border-radius:20px;
    background:var(--panel);
}
.toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    margin-bottom:20px;
}
.section-heading{margin:0;font-size:21px}
.section-subtext{margin:5px 0 0;color:var(--muted);font-size:14px}
.search-box{position:relative;width:min(390px,100%)}
.search-input,.field,.select-field,.text-area{
    width:100%;
    border:1px solid var(--border);
    border-radius:14px;
    outline:none;
    background:var(--card);
    color:var(--text);
}
.search-input,.field,.select-field{min-height:48px;padding:0 16px}
.search-input{padding-right:46px}
.search-input::placeholder,.field::placeholder,.text-area::placeholder{color:#968aa9}
.search-input:focus,.field:focus,.select-field:focus,.text-area:focus{
    border-color:rgba(139,92,246,.8);
    box-shadow:0 0 0 3px rgba(139,92,246,.14);
}
.search-icon{
    position:absolute;
    top:50%;
    right:15px;
    transform:translateY(-50%);
    pointer-events:none;
}
.card-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:16px;
}
.app-card{
    display:flex;
    flex-direction:column;
    min-height:170px;
    padding:22px;
    border:1px solid var(--border);
    border-radius:18px;
    background:var(--card);
    box-shadow:0 12px 28px rgba(0,0,0,.17);
    cursor:pointer;
    transition:.18s ease;
}
.app-card:hover{
    transform:translateY(-2px);
    border-color:rgba(139,92,246,.65);
    background:#2c2146;
}
.card-icon{
    display:grid;
    place-items:center;
    width:42px;
    height:42px;
    margin-bottom:18px;
    border-radius:12px;
    background:rgba(139,92,246,.2);
    font-size:20px;
}
.card-title{margin:0;font-size:19px}
.card-role{margin:8px 0 0;color:var(--purple-soft);font-size:14px;font-weight:700}
.card-description{margin:14px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
.empty-state{
    grid-column:1/-1;
    padding:38px 24px;
    border:1px dashed rgba(255,255,255,.18);
    border-radius:18px;
    text-align:center;
    background:rgba(38,29,60,.52);
}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.field-group{display:flex;flex-direction:column;gap:8px}
.field-group.full{grid-column:1/-1}
.field-label{font-size:14px;font-weight:700;color:var(--purple-soft)}
.text-area{min-height:130px;padding:14px;resize:vertical}
.form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:18px}
.profile-layout{
    display:grid;
    grid-template-columns:280px minmax(0,1fr);
    gap:24px;
    margin-top:24px;
}
.profile-card{
    padding:24px;
    border:1px solid var(--border);
    border-radius:20px;
    background:var(--panel);
}
.avatar{
    display:grid;
    place-items:center;
    width:110px;
    height:110px;
    margin:0 auto 18px;
    border-radius:28px;
    background:linear-gradient(135deg,rgba(139,92,246,.35),rgba(38,29,60,.9));
    font-size:42px;
    font-weight:800;
}
.profile-name{text-align:center;margin:0}
.profile-role{text-align:center;color:var(--purple-soft);font-weight:700}
.traits{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.trait{
    padding:7px 10px;
    border-radius:999px;
    background:rgba(139,92,246,.16);
    color:var(--purple-soft);
    font-size:13px;
}
@media(max-width:900px){
    .card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .profile-layout{grid-template-columns:1fr}
}
@media(max-width:820px){
    .app-header{align-items:flex-start;flex-direction:column;padding:16px 18px}
    .navbar{width:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}
    .nav-link{flex:0 0 auto}
    .dashboard-shell{width:min(100% - 24px,1100px);padding-top:24px}
    .hero{align-items:flex-start;flex-direction:column;padding:30px 24px}
    .toolbar{align-items:stretch;flex-direction:column}
    .search-box{width:100%}
}
@media(max-width:560px){
    .hero p{font-size:16px}
    .primary-button,.secondary-button,.danger-button{width:100%}
    .panel,.profile-card{padding:18px}
    .card-grid,.form-grid{grid-template-columns:1fr}
    .field-group.full{grid-column:auto}
    .form-actions{flex-direction:column}
}
</style>

</head>
<body class="page-character">
<header class="app-header">
    <div class="logo">📚 <span>Her</span></div>
    <nav class="navbar" data-her-navigation></nav>
</header>

<main class="dashboard-shell">
    <section class="hero">
        <div class="hero-copy">
            <p class="eyebrow">Character profile</p>
            <h1 id="profileTitle">Character</h1>
            <p>Develop this character's identity, personality, history, goals, and role in the story.</p>
        </div>
        <button class="primary-button" type="button" onclick="saveCharacter()">Save Character</button>
    </section>

    <section class="profile-layout">
        <aside class="profile-card">
            <div class="avatar"><span id="portraitInitial">?</span></div>
            <h2 class="profile-name" id="profileNameSide">Character</h2>
            <p class="profile-role" id="profileRole">Role</p>
            <div class="traits" id="traitList">
                <span class="trait">Draft</span>
            </div>
        </aside>

        <section class="profile-card">
            <div class="form-grid">
                <label class="field-group">
                    <span class="field-label">Full Name</span>
                    <input class="field" id="name">
                </label>
                <label class="field-group">
                    <span class="field-label">Nickname</span>
                    <input class="field" id="nickname">
                </label>
                <label class="field-group">
                    <span class="field-label">Role</span>
                    <select class="select-field" id="role"></select>
                </label>
                <label class="field-group">
                    <span class="field-label">Age</span>
                    <input class="field" id="age">
                </label>
                <label class="field-group full">
                    <span class="field-label">Occupation</span>
                    <input class="field" id="occupation">
                </label>
                <label class="field-group full">
                    <span class="field-label">Appearance</span>
                    <textarea class="text-area" id="appearance"></textarea>
                </label>
                <label class="field-group full">
                    <span class="field-label">Personality</span>
                    <textarea class="text-area" id="personality"></textarea>
                </label>
                <label class="field-group full">
                    <span class="field-label">Backstory</span>
                    <textarea class="text-area" id="backstory"></textarea>
                </label>
                <label class="field-group full">
                    <span class="field-label">Goals</span>
                    <textarea class="text-area" id="goals"></textarea>
                </label>
                <label class="field-group full">
                    <span class="field-label">Notes</span>
                    <textarea class="text-area" id="notes"></textarea>
                </label>
            </div>

            <div class="form-actions">
                <button class="danger-button" type="button" onclick="deleteCharacter()">Delete</button>
                <a class="secondary-button" href="characters.html" style="display:grid;place-items:center;text-decoration:none">Back</a>
                <button class="primary-button" type="button" onclick="saveCharacter()">Save</button>
            </div>
        </section>
    </section>
</main>

<script src="../js/navigation.js"></script>
<script src="../js/config.js"></script>
<script src="../js/utils/constants.js"></script>
<script src="../js/utils/helpers.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/modules/books/books.js"></script>
<script src="../js/modules/characters/characters.js"></script>
<script src="../js/modules/ui/notifications.js"></script>
<script src="../js/app.js"></script>
<script>
const book = HerBooks.getCurrent();
const characterId = localStorage.getItem(HerConfig.storageKeys.currentCharacter);

if (!book || !characterId) window.location.href = "characters.html";

let character = HerCharacters.find(book.id, characterId);
if (!character) window.location.href = "characters.html";

function loadRoleOptions() {
    document.getElementById("role").innerHTML = HER_CONSTANTS.ROLES.map(role => `
        <option value="${role}">${role}</option>
    `).join("");
}

function loadCharacter() {
    document.getElementById("name").value = character.name || "";
    document.getElementById("nickname").value = character.nickname || "";
    document.getElementById("role").value = character.role || "Supporting Character";
    document.getElementById("age").value = character.age || "";
    document.getElementById("occupation").value = character.occupation || "";
    document.getElementById("appearance").value = character.appearance || "";
    document.getElementById("personality").value = character.personality || "";
    document.getElementById("backstory").value = character.backstory || "";
    document.getElementById("goals").value = character.goals || "";
    document.getElementById("notes").value = character.notes || "";

    const name = character.name || "Character";
    const role = character.role || "Supporting Character";

    document.getElementById("profileTitle").textContent = name;
    document.getElementById("profileNameSide").textContent = name;
    document.getElementById("profileRole").textContent = role;
    document.getElementById("portraitInitial").textContent = name.charAt(0).toUpperCase();
}

function saveCharacter() {
    HerCharacters.update(book.id, characterId, {
        name: getInputValue("#name"),
        nickname: getInputValue("#nickname"),
        role: getInputValue("#role"),
        age: getInputValue("#age"),
        occupation: getInputValue("#occupation"),
        appearance: getInputValue("#appearance"),
        personality: getInputValue("#personality"),
        backstory: getInputValue("#backstory"),
        goals: getInputValue("#goals"),
        notes: getInputValue("#notes")
    });

    character = HerCharacters.find(book.id, characterId);
    loadCharacter();
    HerNotifications.success("Character saved");
}

function deleteCharacter() {
    if (!confirm("Delete this character?")) return;

    HerCharacters.delete(book.id, characterId);
    HerNotifications.success("Character deleted");

    setTimeout(() => {
        window.location.href = "characters.html";
    }, 400);
}

loadRoleOptions();
loadCharacter();
</script>
</body>
</html>
