<!DOCTYPE html> 
<html lang="en"> 
<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Character Profile - Her</title> <style> *{ margin:0; padding:0; box-sizing:border-box; font-family:Arial, Helvetica, sans-serif; } body{ background:#faf8f2; color:#222; } header{ background:#5B3FD6; color:white; padding:18px; display:flex; justify-content:space-between; align-items:center; } .container{ max-width:900px; margin:20px auto; padding:20px; } .section{ background:white; padding:20px; margin-bottom:20px; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,.08); } .section h2{ color:#5B3FD6; margin-bottom:15px; } input, select, textarea{ width:100%; padding:12px; margin-bottom:12px; border:1px solid #ddd; border-radius:10px; font-size:16px; } textarea{ min-height:120px; resize:vertical; } button{ background:#5B3FD6; color:white; border:none; padding:14px 20px; border-radius:10px; cursor:pointer; font-size:16px; } </style> </head> <body> <header> <h1 id="characterName">Character Profile</h1> <button onclick="saveCharacter()"> Save </button> </header> <div class="container"> <div class="section"> <h2>Basic Information</h2> <input id="name" placeholder="Full Name"> <input id="nickname" placeholder="Nickname"> <select id="role"> <option>Main Character</option> <option>Supporting Character</option> <option>Villain</option> <option>Love Interest</option> <option>Mentor</option> <option>Other</option> </select> <input id="age" placeholder="Age"> <input id="occupation" placeholder="Occupation"> </div> <div class="section"> <h2>Appearance</h2> <textarea id="appearance" placeholder="Describe appearance..."></textarea> </div> <div class="section"> <h2>Personality</h2> <textarea id="personality" placeholder="Describe personality..."></textarea> </div> <div class="section"> <h2>Backstory</h2> <textarea id="backstory" placeholder="Character history..."></textarea> </div> <div class="section"> <h2>Goals & Motivation</h2> <textarea id="goals" placeholder="Goals, dreams, motivation..."></textarea> </div> <div class="section"> <h2>Relationships</h2> <textarea id="relationships" placeholder="Friends, family, enemies..."></textarea> </div> <div class="section"> <h2>Notes</h2> <textarea id="notes" placeholder="Anything else..."></textarea> </div> </div> <script src="/js/storage.js"></script> <script> const books = getBooks(); const book = books[getCurrentBookIndex()]; const characterIndex = localStorage.getItem("currentCharacter"); const character = book.characters[characterIndex]; document.getElementById("characterName").textContent = character.name; name.value = character.name || ""; nickname.value = character.nickname || ""; role.value = character.role || "Supporting Character"; age.value = character.age || ""; occupation.value = character.occupation || ""; appearance.value = character.appearance || ""; personality.value = character.personality || ""; backstory.value = character.backstory || ""; goals.value = character.goals || ""; relationships.value = character.relationships || ""; notes.value = character.notes || ""; function saveCharacter(){ character.name = name.value; character.nickname = nickname.value; character.role = role.value; character.age = age.value; character.occupation = occupation.value; character.appearance = appearance.value; character.personality = personality.value; character.backstory = backstory.value; character.goals = goals.value; character.relationships = relationships.value; character.notes = notes.value; saveBooks(books); document.getElementById("characterName").textContent = character.name; alert("Character saved!"); } </script> </body> </html>
