<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#16111f">
    <title>Her Workspace</title>
    <link rel="stylesheet" href="../css/pages/workspace.css">

<style>
:root{
    --her-bg:#120d1f;
    --her-panel:#1d1630;
    --her-card:#261d3c;
    --her-purple:#8b5cf6;
    --her-text:#ffffff;
    --her-muted:#b9aecb;
    --her-border:rgba(255,255,255,.09);
}
html,body{background:var(--her-bg);color:var(--her-text)}
.workspace-header{
    background:rgba(18,13,31,.96);
    border-bottom:1px solid var(--her-border);
    backdrop-filter:blur(14px);
}
.drawer,.bottom-panel,.modal-card{
    background:var(--her-panel);
    color:var(--her-text);
    border-color:var(--her-border);
}
.drawer-link,.icon-button,.ai-toolbar button,.memory-strip button{
    color:var(--her-text);
}
.drawer-link:hover,.drawer-link.active,
.tabs button.active{
    background:rgba(139,92,246,.18);
}
.memory-strip{
    background:rgba(139,92,246,.12);
    border-color:var(--her-border);
}
.story-editor{
    background:#171124;
    color:var(--her-text);
    caret-color:var(--her-purple);
}
.ai-toolbar{
    background:rgba(29,22,48,.98);
    border-color:var(--her-border);
}
.ai-toolbar button,
.panel-footer button,
.modal-card button,
.file-button{
    border-radius:12px;
}
.ai-toolbar button:hover,
.panel-footer button:hover,
.modal-card button:hover{
    background:var(--her-purple);
    color:#fff;
}
.workspace-footer{
    background:#120d1f;
    color:var(--her-muted);
    border-color:var(--her-border);
}
.card,.starter-card,.manual-entry{
    background:var(--her-card);
    color:var(--her-text);
    border-color:var(--her-border);
}
@media(max-width:600px){
    .workspace-header{padding-top:max(10px,env(safe-area-inset-top))}
    .ai-toolbar{
        overflow-x:auto;
        justify-content:flex-start;
        scrollbar-width:none;
    }
    .ai-toolbar::-webkit-scrollbar{display:none}
    .ai-toolbar button{flex:0 0 auto}
}
.story-scan-card{display:grid;gap:10px;padding:16px;border:1px solid var(--her-border);border-radius:14px;background:var(--her-card)} .story-scan-card h3{margin:0} .story-scan-meta{color:var(--her-muted);font-size:14px} .story-scan-evidence{padding:10px;border-radius:10px;background:rgba(139,92,246,.1);color:var(--her-muted)}
</style>

</head>
<body>
<div class="workspace">
    <aside class="drawer" id="drawer">
        <div class="drawer-heading">
            <strong id="drawerBookTitle">Untitled Book</strong>
            <span id="drawerChapterTitle">Chapter 1</span>
        </div>
        <button class="drawer-link active" onclick="closeDrawer()">✍️ Write</button>
        <button class="drawer-link" onclick="location.href='books.html'">📚 Books</button>
        <button class="drawer-link" onclick="location.href='characters.html'">👥 Characters</button>
        <button class="drawer-link" onclick="location.href='world.html'">🌍 World</button>
        <button class="drawer-link" onclick="openLibrary('ideas')">💡 Ideas</button>
        <button class="drawer-link" onclick="openInsights()">✨ Insights</button>
        <button class="drawer-link" onclick="location.href='settings/settings.html'">⚙️ Settings</button>
        <button class="drawer-link" onclick="openTools()">📦 Backup & Export</button>
    </aside>

    <header class="workspace-header">
        <button class="icon-button" onclick="toggleDrawer()" aria-label="Open menu">☰</button>
        <div class="workspace-title">
            <strong id="bookTitle">Untitled Book</strong>
            <span id="chapterTitle">Chapter 1</span>
        </div>
        <span class="save-status" id="saveStatus">Saved ✓</span>
    </header>

    <div class="memory-strip" id="memoryStrip">
        <span>Observer is learning this story</span>
        <button onclick="openInsights()">View insights</button>
    </div>
    <div class="knowledge-strip" id="knowledgeStrip">
        <button onclick="location.href='characters.html'"><strong id="knownCharacters">0</strong><span>Characters</span></button>
        <button onclick="location.href='world.html'"><strong id="knownLocations">0</strong><span>Locations</span></button>
        <button onclick="openLibrary('ideas')"><strong id="knownIdeas">0</strong><span>Ideas</span></button>
        <button onclick="openInsights()"><strong id="knownInsights">0</strong><span>Insights</span></button>
    </div>

    <main class="editor-area">
        <textarea id="storyEditor" class="story-editor" placeholder="Start writing..."></textarea>
        <button id="suggestionChip" class="suggestion-chip hidden" onclick="useLiveSuggestion()"></button>
    </main>

    <div class="ai-toolbar">
        <button id="collaborateButton" class="her-primary" onclick="runCollaboration()">✨ Write with Her</button>
        <button onclick="openRewriteMenu()">Rewrite</button>
        <button onclick="openAITools()">AI Tools</button>
        <button onclick="openInsights()">Insights</button>
    </div>

    <footer class="workspace-footer">
        <span id="wordCount">0 words</span>
        <span id="chapterCounts">0 ideas · 0 plot points</span>
        <span id="readTime">1 min read</span>
    </footer>
</div>

<div class="overlay" id="overlay" onclick="closePanels()"></div>

<section class="bottom-panel" id="resultPanel" aria-hidden="true">
    <div class="panel-handle"></div>
    <header class="panel-header">
        <div>
            <p>Her AI</p>
            <h2 id="resultTitle">Result</h2>
            <small id="resultStatus">Ready</small>
        </div>
        <button class="icon-button" onclick="closePanels()">✕</button>
    </header>
    <div class="panel-body" id="resultBody"></div>
    <div class="panel-footer" id="resultFooter"></div>
</section>

<section class="bottom-panel" id="libraryPanel" aria-hidden="true">
    <div class="panel-handle"></div>
    <header class="panel-header">
        <div>
            <p>Current chapter</p>
            <h2 id="libraryTitle">Ideas</h2>
            <small id="libraryStatus"></small>
        </div>
        <button class="icon-button" onclick="closePanels()">✕</button>
    </header>
    <div class="tabs" id="libraryTabs">
        <button data-tab="brainstorms" onclick="openLibrary('brainstorms')">Brainstorming</button>
        <button data-tab="ideas" onclick="openLibrary('ideas')">Ideas</button>
        <button data-tab="plotPoints" onclick="openLibrary('plotPoints')">Plot Points</button>
        <button data-tab="continuity" onclick="openLibrary('continuity')">Continuity</button>
        <button data-tab="summaries" onclick="openLibrary('summaries')">Memory</button>
    </div>
    <div class="panel-body" id="libraryBody"></div>
    <div class="panel-footer" id="libraryFooter"></div>
</section>

<div class="modal" id="rewriteModal">
    <div class="modal-card">
        <h3>Rewrite style</h3>
        <button onclick="runRewrite('standard')">Smooth & clear</button>
        <button onclick="runRewrite('darker')">Darker</button>
        <button onclick="runRewrite('softer')">Softer</button>
        <button onclick="runRewrite('suspenseful')">More suspenseful</button>
        <button class="secondary" onclick="closeRewriteMenu()">Cancel</button>
    </div>
</div>

<div class="modal" id="aiToolsModal">
    <div class="modal-card">
        <h3>AI Editing Tools</h3>
        <div class="tool-grid">
            <button onclick="closeAITools();runAI('grammar')">Grammar</button>
            <button onclick="closeAITools();runAI('brainstorm')">Brainstorm</button>
            <button onclick="closeAITools();runAI('section_starter')">Flow Starter</button>
            <button onclick="closeAITools();runAI('continuity_check')">Continuity</button>
            <button onclick="closeAITools();runAI('chapter_summary')">Summarize</button>
            <button onclick="closeAITools();scanStoryCharacters()">Scan Characters</button>
        </div>
        <button class="secondary" onclick="closeAITools()">Close</button>
    </div>
</div>

<div class="modal" id="toolsModal">
    <div class="modal-card">
        <h3>Backup & Export</h3>
        <button onclick="exportBookText()">Export book as TXT</button>
        <button onclick="exportBackup()">Export full backup</button>
        <label class="file-button">Import backup<input type="file" accept=".json" onchange="importBackup(event)"></label>
        <button class="secondary" onclick="closeTools()">Close</button>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/utils/helpers.js"></script>
<script src="../js/services/cloudBooks.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/modules/books/books.js"></script>
<script src="../js/modules/books/chapters.js"></script>
<script src="../js/modules/characters/characters.js"></script>
<script src="../js/modules/ai/ai.js"></script>
<script src="../js/modules/ai/storyIntelligence.js"></script>
<script src="../js/modules/brains/core.js"></script>
<script src="../js/modules/brains/knowledge.js"></script>
<script src="../js/modules/brains/analyst.js"></script>
<script src="../js/modules/brains/world.js"></script>
<script src="../js/modules/brains/character.js"></script>
<script src="../js/modules/brains/coauthor.js"></script>
<script src="../js/modules/brains/observer.js"></script>
<script>

function openDashboard() {
    window.location.href = "dashboard.html";
}

const SESSION_KEY =
    HerConfig.storageKeys.lastSession || "her_last_session_v1";

const CURRENT_BOOK_ID =
    localStorage.getItem(HerConfig.storageKeys.currentBook);

const CURRENT_CHAPTER_ID =
    localStorage.getItem(HerConfig.storageKeys.currentChapter);

let currentBook = HerBooks.getAll().find(
    item => item.id === CURRENT_BOOK_ID
) || null;

let currentChapter = currentBook
    ? HerChapters.find(currentBook.id, CURRENT_CHAPTER_ID)
    : null;

if (!currentBook) {
    window.location.replace("books.html");
}

if (!currentChapter) {
    window.location.replace("chapters.html");
}

function normalizeChapter(chapterData) {
    return {
        ...chapterData,
        content: chapterData.content || chapterData.manuscript || "",
        manuscript: chapterData.manuscript || chapterData.content || "",
        brainstorms: Array.isArray(chapterData.brainstorms) ? chapterData.brainstorms : [],
        ideas: Array.isArray(chapterData.ideas) ? chapterData.ideas : [],
        plotPoints: Array.isArray(chapterData.plotPoints) ? chapterData.plotPoints : [],
        sectionStarters: Array.isArray(chapterData.sectionStarters) ? chapterData.sectionStarters : [],
        continuityIssues: Array.isArray(chapterData.continuityIssues) ? chapterData.continuityIssues : [],
        summary: chapterData.summary || "",
        summaryUpdatedAt: chapterData.summaryUpdatedAt || null,
        rewriteHistory: Array.isArray(chapterData.rewriteHistory) ? chapterData.rewriteHistory : []
    };
}

currentChapter = normalizeChapter(currentChapter);

function book() {
    return currentBook;
}

function chapter() {
    return currentChapter;
}

function reloadCurrentData() {
    currentBook = HerBooks.getAll().find(
        item => item.id === CURRENT_BOOK_ID
    ) || currentBook;

    const latestChapter = HerChapters.find(
        CURRENT_BOOK_ID,
        CURRENT_CHAPTER_ID
    );

    if (latestChapter) {
        currentChapter = normalizeChapter(latestChapter);
    }
}

function id(prefix) {
    return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function esc(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function saveNow() {
    currentChapter.content = editor.value;
    currentChapter.manuscript = editor.value;

    const saved = HerChapters.update(
        CURRENT_BOOK_ID,
        CURRENT_CHAPTER_ID,
        {
            content: editor.value,
            manuscript: editor.value,
            brainstorms: currentChapter.brainstorms,
            ideas: currentChapter.ideas,
            plotPoints: currentChapter.plotPoints,
            sectionStarters: currentChapter.sectionStarters,
            continuityIssues: currentChapter.continuityIssues,
            summary: currentChapter.summary,
            summaryUpdatedAt: currentChapter.summaryUpdatedAt,
            rewriteHistory: currentChapter.rewriteHistory
        }
    );

    if (saved) {
        currentChapter = normalizeChapter(saved);
    }

    localStorage.setItem(
        SESSION_KEY,
        JSON.stringify({
            bookId: CURRENT_BOOK_ID,
            chapterId: CURRENT_CHAPTER_ID,
            cursor: editor.selectionStart,
            savedAt: new Date().toISOString()
        })
    );

    $("saveStatus").textContent = "Saved ✓";
    updateCounts();
}

function scheduleSave() {
    $("saveStatus").textContent = "Saving...";
    if (window.HerObserver) HerObserver.schedule({ book: currentBook, chapter: currentChapter, manuscript: editor.value });
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 450);
}

function runObserverNow() {
    if (!window.HerObserver) return;
    const state = HerObserver.observe({ book: currentBook, chapter: currentChapter, manuscript: editor.value });
    $("memoryStrip").firstElementChild.textContent = `Observer active · ${state.characters.length} characters · ${state.world.locations.length} locations`;
}

async function runCollaboration() {
    if (!window.HerObserver || !window.HerAI) return errorResult(new Error("Her's collaboration engine is unavailable."));
    const button = $("collaborateButton");
    const original = button.textContent;
    button.disabled = true;
    button.textContent = "Her is thinking...";
    $("memoryStrip").firstElementChild.textContent = "Observer is coordinating the five brains...";
    try {
        saveNow();
        const { result } = await HerObserver.collaborate({ book: currentBook, chapter: currentChapter, manuscript: editor.value });
        showCollaborationResult(result);
        $("memoryStrip").firstElementChild.textContent = "Her's continuation is ready for review";
    } catch (error) {
        errorResult(error);
        $("memoryStrip").firstElementChild.textContent = "AI collaboration failed — your writing is still saved";
    } finally {
        button.disabled = false;
        button.textContent = original;
    }
}

function showCollaborationResult(result) {
    const continuation = String(result?.continuation || "").trim();
    if (!continuation) return errorResult(new Error("Her returned an empty continuation."));
    $("resultTitle").textContent = "Her's Continuation";
    $("resultStatus").textContent = result.observerDecision || "Five-brain collaboration complete";
    $("resultBody").innerHTML = `
        <div class="result-text" id="collaborationText"></div>
        ${(result.analystNotes || []).length ? `<div class="ai-analysis"><strong>Analyst</strong><ul>${result.analystNotes.map(note => `<li>${String(note).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}</li>`).join("")}</ul></div>` : ""}
    `;
    $("collaborationText").textContent = continuation;
    $("resultFooter").innerHTML = `
        <button class="primary-button" onclick="acceptCollaboration()">Accept</button>
        <button onclick="rewriteCollaboration()">Rewrite</button>
        <button onclick="undoLastAIContinuation()">Undo Rewrite</button>
        <button onclick="closePanels()">Delete</button>
    `;
    window.currentCollaboration = result;
    openPanel($("resultPanel"));
}

function acceptCollaboration() {
    const text = String(window.currentCollaboration?.continuation || "").trim();
    if (!text) return;
    const separator = editor.value && !editor.value.endsWith("\n") ? "\n\n" : "";
    const before = editor.value;
    currentChapter.rewriteHistory = currentChapter.rewriteHistory || [];
    currentChapter.rewriteHistory.push({ type: "ai-continuation", before, createdAt: new Date().toISOString() });
    editor.value = before + separator + text;
    editor.selectionStart = editor.selectionEnd = editor.value.length;
    scheduleSave();
    closePanels();
}

async function rewriteCollaboration() {
    closePanels();
    await runCollaboration();
}

function persistObserverKnowledge(state) {
    if (!state || !CURRENT_BOOK_ID || !CURRENT_CHAPTER_ID) return;
    HerBooks.update(CURRENT_BOOK_ID, {
        characters: state.characters || [],
        locations: state.world?.locations || [],
        organizations: state.world?.organizations || [],
        artifacts: state.world?.artifacts || [],
        timeline: state.timeline || []
    });
    const saved = HerChapters.update(CURRENT_BOOK_ID, CURRENT_CHAPTER_ID, {
        ideas: state.ideas || [],
        characters: (state.characters || []).filter(c => (c.appearances || []).includes(CURRENT_CHAPTER_ID)).map(c => c.id),
        locations: (state.world?.locations || []).filter(x => (x.linkedChapters || []).includes(CURRENT_CHAPTER_ID)).map(x => x.id),
        continuityIssues: state.insights || []
    });
    if (saved) currentChapter = normalizeChapter(saved);
    currentBook = HerBooks.getAll().find(item => item.id === CURRENT_BOOK_ID) || currentBook;
}

HerBrainCore?.HerBrainBus?.on("observer:updated", state => {
    updateKnowledgeStrip(state);
    if (!state) return;
    persistObserverKnowledge(state);
    const total = (state.characters?.length || 0) + (state.world?.locations?.length || 0) + (state.world?.organizations?.length || 0);
    $("memoryStrip").firstElementChild.textContent = `Observer updated · ${state.characters.length} characters · ${state.world.locations.length} locations · ${total} discoveries`;
});

function initialize() {
    editor.value = currentChapter.content || currentChapter.manuscript || "";

    ["bookTitle", "drawerBookTitle"].forEach(id => {
        $(id).textContent = currentBook.title || "Untitled Book";
    });

    ["chapterTitle", "drawerChapterTitle"].forEach(id => {
        $(id).textContent = currentChapter.title || "Untitled Chapter";
    });

    updateStats();
    updateCounts();
    if (window.HerObserver) HerObserver.observe({ book: currentBook, chapter: currentChapter, manuscript: editor.value });

    try {
        const session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");

        if (
            session?.bookId === CURRENT_BOOK_ID &&
            session?.chapterId === CURRENT_CHAPTER_ID
        ) {
            const cursor = Math.min(session.cursor || 0, editor.value.length);
            editor.setSelectionRange(cursor, cursor);
        }
    } catch {
        /* Ignore invalid old session data. */
    }
}

function updateStats() {
    const text = editor.value.trim();
    const words = text ? text.split(/\s+/).length : 0;
    $("wordCount").textContent = `${words} words`;
    $("readTime").textContent = `${Math.max(1, Math.ceil(words / 200))} min read`;
}

function updateCounts() {
    $("chapterCounts").textContent =
        `${chapter().ideas.length} ideas · ${chapter().plotPoints.length} plot points`;
    $("memoryStrip").firstElementChild.textContent =
        chapter().summary ? "AI memory updated" : "AI memory needs a chapter summary";
}

function toggleDrawer() {
    $("drawer").classList.toggle("open");
    $("overlay").classList.toggle("open");
}

function closeDrawer() {
    $("drawer").classList.remove("open");
    if (!$("resultPanel").classList.contains("open") && !$("libraryPanel").classList.contains("open")) {
        $("overlay").classList.remove("open");
    }
}

function openPanel(panel) {
    closeDrawer();
    closePanels(false);
    panel.classList.add("open");
    panel.setAttribute("aria-hidden", "false");
    $("overlay").classList.add("open");
}

function closePanels(closeOverlay = true) {
    [$("resultPanel"), $("libraryPanel")].forEach(panel => {
        panel.classList.remove("open");
        panel.setAttribute("aria-hidden", "true");
    });
    if (closeOverlay) $("overlay").classList.remove("open");
}

function selectedText() {
    return editor.value.substring(editor.selectionStart, editor.selectionEnd).trim();
}

function recentWriting() {
    return editor.value.trim().slice(-6000);
}

function buildMemory() {
    const previousChapters = (Array.isArray(book().chapters) ? book().chapters : [])
        .filter(c => c.id !== CURRENT_CHAPTER_ID)
        .map(c => ({ title: c.title, summary: c.summary, plotPoints: c.plotPoints }))
        .filter(c => c.summary || c.plotPoints?.length);

    return {
        book: {
            title: book().title,
            genre: book().genre,
            summary: book().bookSummary,
            characters: book().characters,
            locations: book().locations,
            organizations: book().organizations,
            artifacts: book().artifacts,
            magic: book().magic,
            timeline: book().timeline,
            notes: book().notes
        },
        currentChapter: {
            title: chapter().title,
            manuscript: editor.value.trim(),
            recentWriting: recentWriting(),
            summary: chapter().summary,
            ideas: chapter().ideas.map(x => x.text),
            plotPoints: chapter().plotPoints.map(x => x.text),
            priorSuggestions: chapter().sectionStarters.map(x => x.text)
        },
        previousChapters
    };
}

function aiInput(action) {
    const selection = selectedText();
    if (["rewrite", "grammar"].includes(action)) return selection || editor.value.trim();
    if (action === "continuity_check") return editor.value.trim() || "Check saved story memory.";
    if (action === "chapter_summary") return editor.value.trim();
    return editor.value.trim();
}

function titleFor(action) {
    return ({
        continue: "Continue Writing",
        rewrite: "Rewrite",
        grammar: "Grammar Check",
        brainstorm: "Brainstorm",
        combine_ideas: "Combined Idea",
        section_starter: "Flow Starter",
        continuity_check: "Continuity Check",
        chapter_summary: "Chapter Summary",
        book_summary: "Book Summary"
    })[action] || "Her AI";
}

function loading(action) {
    $("resultTitle").textContent = titleFor(action);
    $("resultStatus").textContent = "Her is thinking...";
    $("resultBody").innerHTML = '<div class="loading"><i></i><i></i><i></i></div>';
    $("resultFooter").innerHTML = '<button class="secondary" onclick="closePanels()">Cancel</button>';
    openPanel($("resultPanel"));
}

function errorResult(error) {
    $("resultStatus").textContent = "Something went wrong";
    $("resultBody").textContent = error?.message || "AI request failed.";
    $("resultFooter").innerHTML =
        `<button onclick="runAI('${lastAIAction}')">Try again</button>
         <button class="secondary" onclick="closePanels()">Close</button>`;
}

async function runAI(action, options = {}) {
    const input = options.prompt || aiInput(action);
    if (!input) {
        alert("Write something first.");
        return;
    }

    lastAIAction = action;
    originalText = editor.value;
    loading(action);

    try {
        const reply = await HerAI.ask(action, input, buildMemory(), options);
        lastAIResponse = String(reply || "").trim();
        $("resultStatus").textContent = "Ready";

        if (action === "brainstorm") return showBrainstorms(reply);
        if (action === "section_starter") return showStarter(reply);
        if (action === "continuity_check") return showContinuity(reply);
        if (action === "chapter_summary") return saveChapterSummary(reply);
        if (action === "book_summary") return saveBookSummary(reply);

        showStandard(action, reply);
    } catch (error) {
        errorResult(error);
    }
}

function normalizeList(reply) {
    if (Array.isArray(reply)) return reply.map(String).map(x => x.trim()).filter(Boolean);
    if (reply && Array.isArray(reply.ideas)) return reply.ideas.map(String).map(x => x.trim()).filter(Boolean);
    return String(reply || "").replace(/\r/g, "").split(/\n(?=\s*(?:\d+[.)]|[-•*]))/)
        .map(x => x.replace(/^\s*(?:\d+[.)]|[-•*])\s*/, "").trim()).filter(Boolean);
}

function showBrainstorms(reply) {
    currentBrainstormBatch = normalizeList(reply);
    const batchId = id("batch");
    currentBrainstormBatch.forEach(text => chapter().brainstorms.push({
        id: id("brainstorm"), batchId, text, createdAt: new Date().toISOString()
    }));
    saveNow();
    renderBrainstormResult();
}

function renderBrainstormResult() {
    $("resultBody").innerHTML = `
        <p class="note">Select two or more ideas to combine them.</p>
        <div class="card-list">${currentBrainstormBatch.map((text, index) => `
            <article class="card selectable">
                <input type="checkbox" class="brainstorm-check" value="${index}" onchange="updateBrainstormActions()">
                <div><p>${esc(text)}</p>
                <div class="small-actions">
                    <button onclick="saveIdea(${JSON.stringify(text)})">Save as Idea</button>
                    <button class="secondary" onclick="regenerateIdea(${index})">Regenerate</button>
                </div></div>
            </article>`).join("")}</div>`;
    updateBrainstormActions();
}

function updateBrainstormActions() {
    const count = document.querySelectorAll(".brainstorm-check:checked").length;
    $("resultFooter").innerHTML = `
        <button ${count < 2 ? "disabled" : ""} onclick="combineSelected()">Combine selected (${count})</button>
        <button class="secondary" onclick="runAI('brainstorm')">Generate more</button>`;
}

async function regenerateIdea(index) {
    const oldIdea = currentBrainstormBatch[index];
    loading("brainstorm");
    try {
        const reply = await HerAI.ask("regenerate_idea", oldIdea, buildMemory());
        currentBrainstormBatch[index] = String(reply).trim();
        $("resultTitle").textContent = "Brainstorm";
        $("resultStatus").textContent = "One idea regenerated";
        renderBrainstormResult();
    } catch (error) { errorResult(error); }
}

function combineSelected() {
    const selected = [...document.querySelectorAll(".brainstorm-check:checked")]
        .map(x => currentBrainstormBatch[Number(x.value)]);
    runAI("combine_ideas", { prompt: JSON.stringify(selected) });
}

function saveIdea(text, source = "brainstorm") {
    const clean = String(text || "").trim();
    if (!clean || chapter().ideas.some(x => x.text === clean)) return;
    chapter().ideas.push({ id: id("idea"), text: clean, source, createdAt: new Date().toISOString() });
    saveNow();
    $("resultStatus").textContent = "Idea saved";
}

function showStarter(reply) {
    const text = String(reply || "").replace(/^["“]|["”]$/g, "").trim();
    const starter = { id: id("starter"), text, createdAt: new Date().toISOString() };
    chapter().sectionStarters.push(starter);
    saveNow();
    $("resultBody").innerHTML = `<article class="starter-card"><small>Suggested first line</small><p>${esc(text)}</p></article>`;
    $("resultFooter").innerHTML = `
        <button onclick="insertText(${JSON.stringify(text)})">Use line</button>
        <button class="secondary" onclick="saveIdea(${JSON.stringify(text)}, 'flow-starter')">Save as Idea</button>
        <button class="secondary" onclick="runAI('section_starter')">Another</button>`;
}

function showStandard(action, reply) {
    lastAIResponse = String(reply || "").trim();
    $("resultBody").textContent = lastAIResponse;

    if (action === "continue") {
        $("resultFooter").innerHTML = `
            <button onclick="insertText(lastAIResponse)">Insert</button>
            <button class="secondary" onclick="runAI('continue')">Generate again</button>`;
        return;
    }

    if (action === "rewrite") {
        $("resultFooter").innerHTML = `
            <button onclick="acceptRewrite()">Accept changes</button>
            <button class="secondary" onclick="redoRewrite()">Redo rewrite</button>
            <button class="secondary" onclick="closePanels()">Keep original</button>`;
        return;
    }

    $("resultFooter").innerHTML = `
        <button onclick="replaceSelectionOrEditor(lastAIResponse)">Accept changes</button>
        <button class="secondary" onclick="closePanels()">Keep original</button>`;
}

function insertText(text) {
    const current = editor.value.trimEnd();
    editor.value = current ? `${current}\n\n${text}` : text;
    updateStats(); saveNow(); closePanels(); editor.focus();
}

function replaceSelectionOrEditor(text) {
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    if (start !== end) editor.value = editor.value.slice(0, start) + text + editor.value.slice(end);
    else editor.value = text;
    updateStats(); saveNow(); closePanels();
}

function openRewriteMenu() { $("rewriteModal").classList.add("open"); }
function closeRewriteMenu() { $("rewriteModal").classList.remove("open"); }

function runRewrite(style) {
    closeRewriteMenu();
    lastRewrite = { style, input: selectedText() || editor.value.trim() };
    runAI("rewrite", { prompt: lastRewrite.input, style });
}

function redoRewrite() {
    chapter().rewriteHistory.push({
        id: id("rewrite"),
        original: lastRewrite.input,
        result: lastAIResponse,
        style: lastRewrite.style,
        createdAt: new Date().toISOString()
    });
    saveNow();
    runAI("rewrite", { prompt: lastRewrite.input, style: lastRewrite.style });
}

function acceptRewrite() {
    chapter().rewriteHistory.push({
        id: id("rewrite"),
        original: lastRewrite.input,
        result: lastAIResponse,
        style: lastRewrite.style,
        accepted: true,
        createdAt: new Date().toISOString()
    });
    replaceSelectionOrEditor(lastAIResponse);
}

function parseContinuity(reply) {
    try {
        const parsed = typeof reply === "string" ? JSON.parse(reply) : reply;
        return Array.isArray(parsed) ? parsed : parsed.issues || [];
    } catch {
        return String(reply || "").split(/\n+/).map(x => x.replace(/^\s*(?:\d+[.)]|[-•*])\s*/, "").trim()).filter(Boolean)
            .map(text => ({ severity: "review", text }));
    }
}

function showContinuity(reply) {
    const issues = parseContinuity(reply);
    chapter().continuityIssues = issues.map(issue => ({
        id: issue.id || id("issue"),
        severity: issue.severity || "review",
        text: issue.text || String(issue),
        resolved: false,
        createdAt: new Date().toISOString()
    }));
    saveNow();
    $("resultBody").innerHTML = issues.length
        ? `<div class="card-list">${issues.map(x => `<article class="card"><strong>${esc(x.severity || "Review")}</strong><p>${esc(x.text || x)}</p></article>`).join("")}</div>`
        : '<div class="empty">No continuity problems found.</div>';
    $("resultFooter").innerHTML = `<button onclick="openLibrary('continuity')">Open continuity list</button>`;
}

function saveChapterSummary(reply) {
    chapter().summary = String(reply || "").trim();
    chapter().summaryUpdatedAt = new Date().toISOString();
    saveNow();
    $("resultBody").textContent = chapter().summary;
    $("resultStatus").textContent = "Chapter memory updated";
    $("resultFooter").innerHTML = `
        <button onclick="runAI('book_summary')">Update book summary</button>
        <button class="secondary" onclick="closePanels()">Done</button>`;
}

function saveBookSummary(reply) {
    const summary = String(reply || "").trim();

    HerBooks.update(CURRENT_BOOK_ID, {
        bookSummary: summary
    });

    currentBook.bookSummary = summary;

    $("resultBody").textContent = summary;
    $("resultStatus").textContent = "Book memory updated";
    $("resultFooter").innerHTML = `<button onclick="closePanels()">Done</button>`;
}

function openLibrary(type) {
    closeDrawer();
    openPanel($("libraryPanel"));
    [...document.querySelectorAll("[data-tab]")].forEach(x => x.classList.toggle("active", x.dataset.tab === type));
    renderLibrary(type);
}

function renderLibrary(type) {
    const map = {
        brainstorms: ["Brainstorming", chapter().brainstorms],
        ideas: ["Ideas", chapter().ideas],
        plotPoints: ["Plot Points", chapter().plotPoints],
        continuity: ["Continuity", chapter().continuityIssues],
        summaries: ["AI Memory", []]
    };
    const [title, items] = map[type];
    $("libraryTitle").textContent = title;

    if (type === "summaries") {
        $("libraryStatus").textContent = chapter().summary ? "Memory available" : "No summary yet";
        $("libraryBody").innerHTML = `
            <article class="card"><strong>Chapter summary</strong><p>${esc(chapter().summary || "No chapter summary yet.")}</p></article>
            <article class="card"><strong>Book summary</strong><p>${esc(book().bookSummary || "No book summary yet.")}</p></article>`;
        $("libraryFooter").innerHTML = `
            <button onclick="runAI('chapter_summary')">Update chapter</button>
            <button class="secondary" onclick="runAI('book_summary')">Update book</button>`;
        return;
    }

    $("libraryStatus").textContent = `${items.length} saved`;
    if (type === "plotPoints") {
        $("libraryBody").innerHTML = `
            <div class="manual-entry"><textarea id="plotPointInput" placeholder="Add an important fact, reveal, promise, mystery, or event..."></textarea>
            <button onclick="addPlotPoint()">Add Plot Point</button></div>
            ${renderCards(items, type)}`;
    } else {
        $("libraryBody").innerHTML = renderCards(items, type);
    }

    $("libraryFooter").innerHTML =
        type === "brainstorms" ? `<button onclick="runAI('brainstorm')">New brainstorm</button>` :
        type === "continuity" ? `<button onclick="runAI('continuity_check')">Check again</button>` : "";
}

function renderCards(items, type) {
    if (!items.length) return '<div class="empty">Nothing saved here yet.</div>';
    return `<div class="card-list">${items.slice().reverse().map(item => `
        <article class="card">
            ${item.severity ? `<strong>${esc(item.severity)}</strong>` : ""}
            <p>${esc(item.text)}</p>
            <div class="small-actions">
                ${type === "brainstorms" ? `<button onclick="saveIdea(${JSON.stringify(item.text)})">Save as Idea</button>` : ""}
                ${type === "continuity" ? `<button onclick="resolveIssue('${item.id}')">${item.resolved ? "Resolved ✓" : "Mark resolved"}</button>` : ""}
                <button class="danger" onclick="deleteLibraryItem('${type}','${item.id}')">Delete</button>
            </div>
        </article>`).join("")}</div>`;
}

function addPlotPoint() {
    const input = $("plotPointInput");
    const text = input.value.trim();
    if (!text) return;
    chapter().plotPoints.push({ id: id("plot"), text, createdAt: new Date().toISOString() });
    saveNow(); renderLibrary("plotPoints");
}

function deleteLibraryItem(type, itemId) {
    if (!confirm("Delete this item?")) return;
    chapter()[type] = chapter()[type].filter(x => x.id !== itemId);
    saveNow(); renderLibrary(type);
}

function resolveIssue(itemId) {
    const issue = chapter().continuityIssues.find(x => x.id === itemId);
    if (issue) issue.resolved = !issue.resolved;
    saveNow(); renderLibrary("continuity");
}

function requestLiveSuggestion() {
    clearTimeout(suggestionTimer);
    $("suggestionChip").classList.add("hidden");
    const text = editor.value.trim();
    if (!text || !/[.!?]["']?$/.test(text)) return;

    suggestionTimer = setTimeout(async () => {
        try {
            const reply = await HerAI.ask("section_starter", text.slice(-2500), buildMemory());
            $("suggestionChip").textContent = String(reply).replace(/^["“]|["”]$/g, "").trim();
            $("suggestionChip").classList.remove("hidden");
        } catch { /* live suggestions fail quietly */ }
    }, 1800);
}

function useLiveSuggestion() {
    insertText($("suggestionChip").textContent);
    $("suggestionChip").classList.add("hidden");
}


let detectedCharacterSuggestions=[];
async function scanStoryCharacters(){const manuscript=editor.value.trim();if(!manuscript){alert("Write part of the chapter before scanning.");return;} saveNow(); $("resultTitle").textContent="Story Intelligence"; $("resultStatus").textContent="Scanning for new characters..."; $("resultBody").innerHTML='<div class="loading"><i></i><i></i><i></i></div>'; $("resultFooter").innerHTML='<button class="secondary" onclick="closePanels()">Cancel</button>'; openPanel($("resultPanel")); try{const currentBook=HerBooks.getCurrent();const currentChapter=HerChapters.find(CURRENT_BOOK_ID,CURRENT_CHAPTER_ID);const result=await HerStoryIntelligence.scanCharacters({book:currentBook,chapter:currentChapter,manuscript});detectedCharacterSuggestions=result.characters.filter(s=>!HerCharacters.findByName(CURRENT_BOOK_ID,s.name));renderCharacterSuggestions();}catch(e){errorResult(e)}}
function renderCharacterSuggestions(){if(!detectedCharacterSuggestions.length){$("resultTitle").textContent="New Characters";$("resultStatus").textContent="No new named characters found";$("resultBody").innerHTML='<div class="empty">Her did not find any new named characters missing from this book.</div>';$("resultFooter").innerHTML='<button onclick="closePanels()">Done</button>';return;} $("resultTitle").textContent="New Characters";$("resultStatus").textContent=`${detectedCharacterSuggestions.length} suggestion${detectedCharacterSuggestions.length===1?'':'s'}`;$("resultBody").innerHTML='<div class="card-list">'+detectedCharacterSuggestions.map((s,i)=>`<article class="story-scan-card"><h3>${esc(s.name)}</h3><div class="story-scan-meta">${esc(s.role||'Supporting Character')}${s.age?' • Age '+esc(s.age):''}${s.occupation?' • '+esc(s.occupation):''}</div>${s.relationships.length?`<p>${esc(s.relationships.join(' • '))}</p>`:''}${s.evidence?`<p class="story-scan-evidence">${esc(s.evidence)}</p>`:''}<div class="small-actions"><button onclick="acceptDetectedCharacter(${i})">Add Draft Profile</button><button class="secondary" onclick="ignoreDetectedCharacter(${i})">Ignore</button></div></article>`).join('')+'</div>';$("resultFooter").innerHTML='<button onclick="acceptAllDetectedCharacters()">Accept All</button><button class="secondary" onclick="closePanels()">Review Later</button>';}
function acceptDetectedCharacter(i){const s=detectedCharacterSuggestions[i];if(!s)return;HerStoryIntelligence.acceptCharacter(CURRENT_BOOK_ID,CURRENT_CHAPTER_ID,s);detectedCharacterSuggestions.splice(i,1);renderCharacterSuggestions()} function ignoreDetectedCharacter(i){detectedCharacterSuggestions.splice(i,1);renderCharacterSuggestions()} function acceptAllDetectedCharacters(){detectedCharacterSuggestions.forEach(s=>HerStoryIntelligence.acceptCharacter(CURRENT_BOOK_ID,CURRENT_CHAPTER_ID,s));detectedCharacterSuggestions=[];renderCharacterSuggestions()}


function openAITools() { $("aiToolsModal").classList.add("open"); }
function closeAITools() { $("aiToolsModal").classList.remove("open"); }

function openInsights() {
    closeDrawer();
    reloadCurrentData();
    const observer = window.HerObserver?.getState ? HerObserver.getState(CURRENT_BOOK_ID) : null;
    const insights = observer?.insights || currentChapter.continuityIssues || [];
    const activeIdeas = (currentChapter.ideas || []).filter(x => !x.status || !["completed","discarded"].includes(String(x.status).toLowerCase()));
    $("resultTitle").textContent = "Story Insights";
    $("resultStatus").textContent = `${insights.length} observation${insights.length === 1 ? "" : "s"} · ${activeIdeas.length} active idea${activeIdeas.length === 1 ? "" : "s"}`;
    $("resultBody").innerHTML = `
        <section class="insight-section"><h3>Observer</h3>${insights.length ? insights.map(item => `<article class="insight-card"><strong>${esc(item.type || item.severity || "Story observation")}</strong><p>${esc(item.text || item.message || item)}</p></article>`).join("") : '<div class="empty">Her has not found any concerns yet.</div>'}</section>
        <section class="insight-section"><h3>Active Story Threads</h3>${activeIdeas.length ? activeIdeas.slice(-8).reverse().map(item => `<article class="insight-card"><strong>${esc(item.status || "Active")}</strong><p>${esc(item.text)}</p></article>`).join("") : '<div class="empty">No active story threads yet.</div>'}</section>`;
    $("resultFooter").innerHTML = `<button onclick="runAI('continuity_check')">Run deeper analysis</button><button class="secondary" onclick="closePanels()">Done</button>`;
    openPanel($("resultPanel"));
}

function undoLastAIContinuation() {
    const history = currentChapter.rewriteHistory || [];
    const entry = [...history].reverse().find(x => x.type === "ai-continuation" && typeof x.before === "string");
    if (!entry) return alert("There is no accepted AI continuation to undo yet.");
    editor.value = entry.before;
    const index = history.lastIndexOf(entry);
    if (index >= 0) history.splice(index, 1);
    saveNow();
    closePanels();
}

function updateKnowledgeStrip(state) {
    const data = state || (window.HerObserver?.getState ? HerObserver.getState(CURRENT_BOOK_ID) : null) || {};
    const chars = data.characters || currentBook.characters || [];
    const locations = data.world?.locations || currentBook.locations || [];
    const ideas = data.ideas || currentChapter.ideas || [];
    const insights = data.insights || currentChapter.continuityIssues || [];
    if ($("knownCharacters")) $("knownCharacters").textContent = chars.length;
    if ($("knownLocations")) $("knownLocations").textContent = locations.length;
    if ($("knownIdeas")) $("knownIdeas").textContent = ideas.length;
    if ($("knownInsights")) $("knownInsights").textContent = insights.length;
}

function openTools() { closeDrawer(); $("toolsModal").classList.add("open"); }
function closeTools() { $("toolsModal").classList.remove("open"); }

function downloadFile(name, content, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = name; link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportBookText() {
    reloadCurrentData();
    const text = (Array.isArray(book().chapters) ? book().chapters : [])
        .map(c => `${c.title}\n\n${c.manuscript || ""}`).join("\n\n\n");
    downloadFile(`${book().title || "Her-Book"}.txt`, text, "text/plain");
}

function exportBackup() {
    saveNow();
    downloadFile(`Her-Backup-${new Date().toISOString().slice(0,10)}.json`,
        JSON.stringify({ books: HerBooks.getAll(), exportedAt: new Date().toISOString() }, null, 2), "application/json");
}

async function importBackup(event) {
    const file = event.target.files?.[0];
    if (!file) return;
    try {
        const imported = JSON.parse(await file.text());
        const books = Array.isArray(imported) ? imported : imported.books;
        if (!Array.isArray(books)) throw new Error("Invalid backup");
        HerBooks.saveAll(books);
        location.reload();
    } catch {
        alert("That file is not a valid Her backup.");
    }
}

editor.addEventListener("input", () => {
    updateStats();
    scheduleSave();
    requestLiveSuggestion();
});
window.addEventListener("beforeunload", saveNow);
initialize();
setTimeout(() => { runObserverNow(); updateKnowledgeStrip(); }, 100);
</script>
