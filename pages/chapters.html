<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chapters | Her</title>
<link rel="stylesheet" href="../css/main.css">

<style>
:root{
    --bg:#120d1f;
    --panel:#1d1630;
    --card:#261d3c;
    --purple:#8b5cf6;
    --purple-soft:#c9b6ff;
    --text:#ffffff;
    --muted:#b9aecb;
    --border:rgba(255,255,255,.09);
    --shadow:0 18px 45px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{
    min-height:100vh;
    margin:0;
    background:
        radial-gradient(circle at top right,rgba(139,92,246,.18),transparent 35%),
        var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app-header{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:18px 28px;
    background:rgba(18,13,31,.94);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(14px);
}
.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:22px;
    font-weight:800;
    white-space:nowrap;
}
.navbar{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    flex-wrap:wrap;
}
.nav-link{
    padding:10px 13px;
    border-radius:10px;
    color:var(--muted);
    font-size:15px;
    font-weight:700;
    text-decoration:none;
}
.nav-link:hover,.nav-link.active{
    background:rgba(139,92,246,.18);
    color:var(--text);
}
.dashboard-shell{
    width:min(1100px,calc(100% - 32px));
    margin:0 auto;
    padding:48px 0 56px;
}
.hero{
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:28px;
    padding:42px 34px;
    border:1px solid var(--border);
    border-radius:24px;
    background:linear-gradient(135deg,rgba(139,92,246,.23),rgba(38,29,60,.95));
    box-shadow:var(--shadow);
}
.hero::after{
    content:"";
    position:absolute;
    right:-70px;
    bottom:-95px;
    width:260px;
    height:260px;
    border-radius:50%;
    background:rgba(255,255,255,.06);
}
.hero-copy{position:relative;z-index:1;max-width:680px}
.eyebrow{
    margin:0 0 12px;
    color:var(--purple-soft);
    font-size:13px;
    font-weight:800;
    letter-spacing:.12em;
    text-transform:uppercase;
}
.hero h1{
    margin:0;
    font-size:clamp(34px,6vw,58px);
    line-height:1.05;
}
.hero p{
    max-width:650px;
    margin:18px 0 0;
    color:#d7cee6;
    font-size:18px;
    line-height:1.6;
}
.primary-button,.secondary-button,.danger-button{
    position:relative;
    z-index:1;
    min-height:48px;
    padding:0 18px;
    border-radius:14px;
    font-weight:800;
}
.primary-button{
    border:0;
    background:var(--purple);
    color:#fff;
    box-shadow:0 12px 28px rgba(139,92,246,.28);
}
.secondary-button{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
}
.danger-button{
    border:1px solid rgba(255,107,129,.35);
    background:rgba(255,107,129,.12);
    color:#ff9caf;
}
.panel{
    margin-top:24px;
    padding:26px;
    border:1px solid var(--border);
    border-radius:20px;
    background:var(--panel);
}
.toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    margin-bottom:20px;
}
.section-heading{margin:0;font-size:21px}
.section-subtext{margin:5px 0 0;color:var(--muted);font-size:14px}
.search-box{position:relative;width:min(390px,100%)}
.search-input,.field,.select-field,.text-area{
    width:100%;
    border:1px solid var(--border);
    border-radius:14px;
    outline:none;
    background:var(--card);
    color:var(--text);
}
.search-input,.field,.select-field{min-height:48px;padding:0 16px}
.search-input{padding-right:46px}
.search-input::placeholder,.field::placeholder,.text-area::placeholder{color:#968aa9}
.search-input:focus,.field:focus,.select-field:focus,.text-area:focus{
    border-color:rgba(139,92,246,.8);
    box-shadow:0 0 0 3px rgba(139,92,246,.14);
}
.search-icon{
    position:absolute;
    top:50%;
    right:15px;
    transform:translateY(-50%);
    pointer-events:none;
}
.card-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:16px;
}
.app-card{
    display:flex;
    flex-direction:column;
    min-height:170px;
    padding:22px;
    border:1px solid var(--border);
    border-radius:18px;
    background:var(--card);
    box-shadow:0 12px 28px rgba(0,0,0,.17);
    cursor:pointer;
    transition:.18s ease;
}
.app-card:hover{
    transform:translateY(-2px);
    border-color:rgba(139,92,246,.65);
    background:#2c2146;
}
.card-icon{
    display:grid;
    place-items:center;
    width:42px;
    height:42px;
    margin-bottom:18px;
    border-radius:12px;
    background:rgba(139,92,246,.2);
    font-size:20px;
}
.card-title{margin:0;font-size:19px}
.card-role{margin:8px 0 0;color:var(--purple-soft);font-size:14px;font-weight:700}
.card-description{margin:14px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
.empty-state{
    grid-column:1/-1;
    padding:38px 24px;
    border:1px dashed rgba(255,255,255,.18);
    border-radius:18px;
    text-align:center;
    background:rgba(38,29,60,.52);
}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.field-group{display:flex;flex-direction:column;gap:8px}
.field-group.full{grid-column:1/-1}
.field-label{font-size:14px;font-weight:700;color:var(--purple-soft)}
.text-area{min-height:130px;padding:14px;resize:vertical}
.form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:18px}
.profile-layout{
    display:grid;
    grid-template-columns:280px minmax(0,1fr);
    gap:24px;
    margin-top:24px;
}
.profile-card{
    padding:24px;
    border:1px solid var(--border);
    border-radius:20px;
    background:var(--panel);
}
.avatar{
    display:grid;
    place-items:center;
    width:110px;
    height:110px;
    margin:0 auto 18px;
    border-radius:28px;
    background:linear-gradient(135deg,rgba(139,92,246,.35),rgba(38,29,60,.9));
    font-size:42px;
    font-weight:800;
}
.profile-name{text-align:center;margin:0}
.profile-role{text-align:center;color:var(--purple-soft);font-weight:700}
.traits{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.trait{
    padding:7px 10px;
    border-radius:999px;
    background:rgba(139,92,246,.16);
    color:var(--purple-soft);
    font-size:13px;
}
@media(max-width:900px){
    .card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .profile-layout{grid-template-columns:1fr}
}
@media(max-width:820px){
    .app-header{align-items:flex-start;flex-direction:column;padding:16px 18px}
    .navbar{width:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}
    .nav-link{flex:0 0 auto}
    .dashboard-shell{width:min(100% - 24px,1100px);padding-top:24px}
    .hero{align-items:flex-start;flex-direction:column;padding:30px 24px}
    .toolbar{align-items:stretch;flex-direction:column}
    .search-box{width:100%}
}
@media(max-width:560px){
    .hero p{font-size:16px}
    .primary-button,.secondary-button,.danger-button{width:100%}
    .panel,.profile-card{padding:18px}
    .card-grid,.form-grid{grid-template-columns:1fr}
    .field-group.full{grid-column:auto}
    .form-actions{flex-direction:column}
}

.chapter-card{position:relative}
.chapter-menu-button{
    position:absolute;top:14px;right:14px;z-index:3;
    width:46px;height:46px;padding:0;border:1px solid var(--border);
    border-radius:14px;background:rgba(18,13,31,.88);
    color:var(--text);font-size:25px;line-height:1;
}
.chapter-menu{
    position:absolute;top:66px;right:14px;z-index:8;
    display:none;min-width:180px;padding:8px;
    border:1px solid var(--border);border-radius:14px;
    background:#171124;box-shadow:0 18px 40px rgba(0,0,0,.42);
}
.chapter-menu.open{display:grid;gap:5px}
.chapter-menu button{
    min-height:46px;padding:0 13px;border:0;border-radius:10px;
    background:transparent;color:var(--text);text-align:left;font-weight:700;
}
.chapter-menu button:hover,.chapter-menu button:focus{background:rgba(139,92,246,.18)}
.chapter-menu .delete-option{color:#ff9caf}
@media(max-width:560px){
    .chapter-menu{
        position:fixed;left:12px;right:12px;top:auto;
        bottom:calc(12px + env(safe-area-inset-bottom));
        min-width:0;padding:12px;border-radius:18px;
    }
    .chapter-menu button{min-height:52px;font-size:16px}
}

</style>

</head>
<body class="page-home">
<header class="app-header">
    <div class="logo">📚 <span>Her</span></div>
    <nav class="navbar" data-her-navigation></nav>
</header>

<main class="dashboard-shell">
    <section class="hero">
        <div class="hero-copy">
            <p class="eyebrow">Current manuscript</p>
            <h1 id="bookTitle">Chapters</h1>
            <p>Organize your manuscript and open any chapter to continue writing.</p>
        </div>
        <button class="primary-button" type="button" onclick="createChapter()">+ Chapter</button>
    </section>

    <section class="panel">
        <div class="toolbar">
            <div>
                <h2 class="section-heading">Chapter Library</h2>
                <p class="section-subtext" id="chapterTotal">0 chapters</p>
            </div>
            <div class="search-box">
                <input id="chapterSearch" class="search-input" type="search" placeholder="Search chapters...">
                <span class="search-icon">🔍</span>
            </div>
        </div>
        <section class="card-grid" id="chapterGrid"></section>
    </section>
</main>

<script src="../js/navigation.js"></script>
<script src="../js/config.js"></script>
<script src="../js/utils/constants.js"></script>
<script src="../js/utils/helpers.js"></script>
<script src="../js/services/cloudBooks.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/modules/books/books.js"></script>
<script src="../js/modules/books/chapters.js"></script>
<script src="../js/modules/books/wordcount.js"></script>
<script src="../js/modules/ui/notifications.js"></script>
<script src="../js/app.js"></script>
<script>
const book = HerBooks.getCurrent();
if (!book) window.location.href = "books.html";

document.getElementById("bookTitle").textContent = book?.title || "Chapters";

function esc(value) {
    return String(value || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function closeChapterMenus() {
    document.querySelectorAll(".chapter-menu.open")
        .forEach(menu => menu.classList.remove("open"));
}

function toggleChapterMenu(event, chapterId) {
    event.preventDefault();
    event.stopPropagation();

    const menu = document.getElementById(`chapterMenu-${chapterId}`);
    const open = menu && !menu.classList.contains("open");

    closeChapterMenus();
    if (open) menu.classList.add("open");
}

function renderChapters(list = HerChapters.getAll(book.id)) {
    const chapters = Array.isArray(list) ? list : [];
    const grid = document.getElementById("chapterGrid");

    document.getElementById("chapterTotal").textContent =
        chapters.length === 1 ? "1 chapter" : `${chapters.length} chapters`;

    if (!chapters.length) {
        grid.innerHTML = `
            <div class="empty-state">
                <h2>No chapters yet</h2>
                <p>Create your first chapter to begin writing.</p>
            </div>`;
        return;
    }

    grid.innerHTML = chapters.map(chapter => `
        <article class="app-card chapter-card" tabindex="0"
            onclick="openChapter('${chapter.id}')"
            onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openChapter('${chapter.id}')}">

            <button class="chapter-menu-button" type="button"
                aria-label="Chapter options"
                onclick="toggleChapterMenu(event,'${chapter.id}')">⋮</button>

            <div class="chapter-menu" id="chapterMenu-${chapter.id}"
                onclick="event.stopPropagation()">
                <button type="button" onclick="renameChapter('${chapter.id}')">✏️ Rename</button>
                <button type="button" onclick="duplicateChapter('${chapter.id}')">📄 Duplicate</button>
                <button class="delete-option" type="button"
                    onclick="deleteChapter('${chapter.id}')">🗑 Delete</button>
            </div>

            <div class="card-icon">📝</div>
            <h2 class="card-title">${esc(chapter.title || "Untitled Chapter")}</h2>
            <p class="card-role">${esc(chapter.status || "Draft")}</p>
            <p class="card-description">
                ${HerWordCount.countWords(chapter.content || chapter.manuscript || "")} words
            </p>
        </article>
    `).join("");
}

function createChapter() {
    const title = prompt("Chapter title:", "New Chapter");
    if (title === null) return;

    const chapter = HerChapters.create(book.id, title.trim() || "New Chapter");

    if (!chapter) {
        alert("The chapter could not be created.");
        return;
    }

    HerNotifications.success("Chapter created");
    openChapter(chapter.id);
}

function openChapter(chapterId) {
    localStorage.setItem(HerConfig.storageKeys.currentBook, book.id);
    localStorage.setItem(HerConfig.storageKeys.currentChapter, chapterId);
    window.location.href = "workspace.html";
}

function renameChapter(chapterId) {
    closeChapterMenus();

    const chapter = HerChapters.find(book.id, chapterId);
    if (!chapter) return;

    const title = prompt("Rename chapter:", chapter.title || "");
    if (title === null) return;

    const renamed = HerChapters.rename(book.id, chapterId, title);

    if (!renamed) {
        alert("Enter a chapter title.");
        return;
    }

    HerNotifications.success("Chapter renamed");
    renderChapters();
}

function duplicateChapter(chapterId) {
    closeChapterMenus();

    const duplicate = HerChapters.duplicate(book.id, chapterId);

    if (!duplicate) {
        alert("The chapter could not be duplicated.");
        return;
    }

    HerNotifications.success("Chapter duplicated");
    renderChapters();
}

function deleteChapter(chapterId) {
    closeChapterMenus();

    const chapter = HerChapters.find(book.id, chapterId);
    if (!chapter) return;

    if (!confirm(`Delete "${chapter.title || "this chapter"}"?\n\nThis cannot be undone.`)) {
        return;
    }

    const result = HerChapters.delete(book.id, chapterId);

    if (!result.success) {
        alert(result.message);
        return;
    }

    HerNotifications.success("Chapter deleted");
    renderChapters();
}

document.getElementById("chapterSearch").addEventListener("input", function() {
    const query = this.value.trim().toLowerCase();
    renderChapters(
        HerChapters.getAll(book.id).filter(chapter =>
            String(chapter.title || "").toLowerCase().includes(query)
        )
    );
});

document.addEventListener("click", closeChapterMenus);
window.addEventListener("blur", closeChapterMenus);

renderChapters();
</script>
</body>
</html>
