<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Her</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body class="page-home">

<header class="app-header">
    <div class="logo">📚 Her</div>
    <nav class="navbar">
        <a class="nav-link active" href="/pages/dashboard.html">Dashboard</a>
        <a class="nav-link" href="/pages/books/books.html">Books</a>
        <a class="nav-link" href="/pages/characters/characters.html">Characters</a>
        <a class="nav-link" href="/pages/world/world.html">World Bible</a>
    </nav>
</header>

<main class="container section">
    <section class="hero text-center">
        <h1>Welcome to Her</h1>
        <p class="card-text">Your writing studio, book planner, character builder, and world bible.</p>
    </section>

    <section class="stat-grid">
        <div class="stat-card">
            <div class="stat-value" id="bookCount">0</div>
            <div class="stat-label">Books</div>
        </div>

        <div class="stat-card">
            <div class="stat-value" id="chapterCount">0</div>
            <div class="stat-label">Chapters</div>
        </div>

        <div class="stat-card">
            <div class="stat-value" id="characterCount">0</div>
            <div class="stat-label">Characters</div>
        </div>

        <div class="stat-card">
            <div class="stat-value" id="wordCount">0</div>
            <div class="stat-label">Words</div>
        </div>
    </section>

    <div class="form-actions">
        <a class="btn" href="/pages/books/books.html">Open Books</a>
        <a class="btn btn-secondary" href="/pages/world/world.html">World Bible</a>
    </div>
</main>

<script src="/js/config.js"></script>
<script src="/js/utils/constants.js"></script>
<script src="/js/utils/helpers.js"></script>
<script src="/js/storage.js"></script>
<script src="/js/modules/books/books.js"></script>
<script src="/js/modules/books/wordcount.js"></script>
<script src="/js/app.js"></script>

<script>
    const books = HerBooks.getAll();

    document.getElementById("bookCount").textContent = books.length;

    let chapters = 0;
    let characters = 0;
    let words = 0;

    books.forEach((book) => {
        const bookChapters = Array.isArray(book.chapters)
            ? book.chapters
            : [];

        const bookCharacters = Array.isArray(book.characters)
            ? book.characters
            : [];

        chapters += bookChapters.length;
        characters += bookCharacters.length;

        bookChapters.forEach((chapter) => {
            words += HerWordCount.countWords(chapter.content || "");
        });
    });

    document.getElementById("chapterCount").textContent = chapters;
    document.getElementById("characterCount").textContent = characters;
    document.getElementById("wordCount").textContent = words;
</script>

</body>
</html>
