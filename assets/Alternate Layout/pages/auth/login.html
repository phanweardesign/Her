<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Her</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #faf8f2;
            font-family: Arial, Helvetica, sans-serif;
        }

        .auth-card {
            width: min(420px, 100%);
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .1);
        }

        h1 {
            margin: 0 0 10px;
            color: #5b3fd6;
            text-align: center;
        }

        .subtitle {
            margin: 0 0 25px;
            color: #666;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 14px;
            color: #333;
            font-weight: 700;
        }

        input {
            width: 100%;
            margin-top: 7px;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            border-color: #5b3fd6;
            outline: none;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: 0;
            border-radius: 12px;
            background: #5b3fd6;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .65;
            cursor: wait;
        }

        .footer {
            margin-top: 18px;
            color: #777;
            text-align: center;
        }

        .footer a {
            color: #5b3fd6;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="auth-card">
        <h1>Welcome Back</h1>
        <p class="subtitle">Continue writing your story</p>

        <form id="loginForm">
            <label for="identifier">Username or Email</label>
            <input
                id="identifier"
                name="identifier"
                type="text"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button id="loginButton" type="submit">Login</button>
        </form>

        <div class="footer">
            Don't have an account?
            <a href="/pages/auth/signup.html">Sign up</a>
        </div>
    </main>

    <script src="/js/config.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/services/apiService.js"></script>
    <script src="/js/services/authService.js"></script>
    <script src="/js/app.js"></script>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const identifier =
                document.getElementById("identifier").value.trim();

            const password =
                document.getElementById("password").value;

            if (!identifier || !password) {
                alert("Enter your username/email and password.");
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Logging In...";

            try {
                const result = await HerAuthService.login(
                    identifier,
                    password
                );

                if (!result.success) {
                    alert(result.message || "Login failed.");
                    return;
                }

                window.location.href = "/pages/dashboard.html";
            } catch (error) {
                console.error("Login error:", error);
                alert(error.message || "Unable to connect to Her.");
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });
    </script>
</body>
</html>
