<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artifacts | Her</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body class="page-world">

<header class="app-header">
    <div class="logo">📚 Her</div>
    <nav class="navbar">
        <a class="nav-link" href="/pages/world/world.html">World Bible</a>
        <a class="nav-link" href="/pages/world/locations.html">Locations</a>
        <a class="nav-link active" href="/pages/world/artifacts.html">Artifacts</a>
        <a class="nav-link" href="/pages/world/magic.html">Magic</a>
    </nav>
</header>

<main class="container section">
    <div class="header-left" style="justify-content:space-between;">
        <div>
            <h1>⚔️ Artifacts</h1>
            <p class="card-text">Track legendary objects, relics, treasures, and weapons.</p>
        </div>
        <button class="btn" onclick="createArtifact()">+ Artifact</button>
    </div>

    <section class="encyclopedia-grid" id="artifactGrid" style="margin-top:25px;"></section>
</main>

<script src="/js/config.js"></script>
<script src="/js/utils/constants.js"></script>
<script src="/js/utils/helpers.js"></script>
<script src="/js/storage.js"></script>
<script src="/js/modules/books/books.js"></script>
<script src="/js/modules/world/artifacts.js"></script>
<script src="/js/modules/ui/notifications.js"></script>
<script src="/js/app.js"></script>

<script>
const book = HerBooks.getCurrent();
if (!book) window.location.href = "books.html";

function renderArtifacts() {
    const artifacts = HerArtifacts.getAll(book.id);
    const grid = document.getElementById("artifactGrid");

    if (artifacts.length === 0) {
        grid.innerHTML = `<div class="card"><h2 class="card-title">No artifacts yet</h2><p class="card-text">Create your first legendary item.</p></div>`;
        return;
    }

    grid.innerHTML = artifacts.map(item => `
        <div class="artifact-card">
            <div class="artifact-name">${item.name}</div>
            <div class="artifact-type">${item.type || "Relic"}</div>
            <div class="artifact-owner">${item.owner ? "Owner: " + item.owner : "No owner listed"}</div>
            <div class="artifact-description">${item.description || item.powers || "No description yet."}</div>
        </div>
    `).join("");
}

function createArtifact() {
    const name = prompt("Artifact name:");
    if (!name) return;

    const type = prompt("Type:", "Relic") || "Relic";
    const owner = prompt("Owner:") || "";

    HerArtifacts.create(book.id, { name, type, owner });
    HerNotifications.success("Artifact created");
    renderArtifacts();
}

renderArtifacts();
</script>

</body>
</html>
