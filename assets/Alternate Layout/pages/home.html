<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Her - Your Books</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #faf8f2;
            font-family: Arial, Helvetica, sans-serif;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 20px;
        }

        .title {
            color: #5b3fd6;
            font-size: 28px;
            font-weight: bold;
        }

        .btn {
            padding: 11px 15px;
            border: 0;
            border-radius: 10px;
            background: #5b3fd6;
            color: white;
            cursor: pointer;
        }

        .search {
            width: 100%;
            margin-bottom: 20px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        .book-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .book {
            padding: 15px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);
            cursor: pointer;
        }

        .book h3 {
            margin: 0 0 5px;
        }

        .book small {
            color: #777;
        }

        .empty {
            margin-top: 40px;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="title">📚 Her</div>
        <button class="btn" type="button" onclick="createBook()">
            + New Book
        </button>
    </header>

    <input
        class="search"
        placeholder="Search your books..."
        oninput="searchBooks(this.value)"
    >

    <div id="bookList" class="book-list"></div>
    <div id="empty" class="empty">
        No books yet. Create your first story ✨
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/utils/helpers.js"></script>
    <script src="/js/modules/books/books.js"></script>
    <script src="/js/app.js"></script>

    <script>
        let books = HerBooks.getAll();

        function renderBooks(list = books) {
            const container = document.getElementById("bookList");
            const empty = document.getElementById("empty");

            container.innerHTML = "";

            if (list.length === 0) {
                empty.style.display = "block";
                return;
            }

            empty.style.display = "none";

            list.forEach((book) => {
                const card = document.createElement("article");
                card.className = "book";
                card.addEventListener("click", () => openBook(book.id));

                const title = document.createElement("h3");
                title.textContent = book.title || "Untitled Book";

                const date = document.createElement("small");
                date.textContent =
                    `Last edited: ${book.updatedAt || book.date || "Not saved"}`;

                card.append(title, date);
                container.appendChild(card);
            });
        }

        function createBook() {
            const title = prompt("Enter book title:");

            if (!title || !title.trim()) {
                return;
            }

            const book = HerBooks.create(title.trim());
            openBook(book.id);
        }

        function openBook(bookId) {
            HerBooks.setCurrent(bookId);
            window.location.href = "/pages/books/chapters.html";
        }

        function searchBooks(query) {
            const normalized = String(query || "").toLowerCase();

            const filtered = books.filter((book) =>
                String(book.title || "")
                    .toLowerCase()
                    .includes(normalized)
            );

            renderBooks(filtered);
        }

        renderBooks();
    </script>
</body>
</html>
