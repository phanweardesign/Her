<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapters | Her</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body class="page-home">

<header class="app-header">
    <div class="logo">📚 Her</div>
    <nav class="navbar">
        <a class="nav-link" href="/pages/books/books.html">Books</a>
        <a class="nav-link active" href="/pages/books/chapters.html">Chapters</a>
        <a class="nav-link" href="/pages/characters/characters.html">Characters</a>
        <a class="nav-link" href="/pages/world/world.html">World Bible</a>
    </nav>
</header>

<main class="container section">

    <div class="header-left" style="justify-content:space-between;">
        <div>
            <h1 id="bookTitle">Chapters</h1>
            <p class="card-text">Organize your manuscript chapter by chapter.</p>
        </div>

        <button class="btn" onclick="createChapter()">+ Chapter</button>
    </div>

    <section class="book-grid" id="chapterGrid" style="margin-top:25px;"></section>

</main>

<script src="/js/config.js"></script>
<script src="/js/utils/constants.js"></script>
<script src="/js/utils/helpers.js"></script>
<script src="/js/storage.js"></script>
<script src="/js/modules/books/books.js"></script>
<script src="/js/modules/books/chapters.js"></script>
<script src="/js/modules/books/wordcount.js"></script>
<script src="/js/modules/ui/notifications.js"></script>
<script src="/js/app.js"></script>

<script>
const book = HerBooks.getCurrent();

if (!book) {
    window.location.href = "books.html";
}

document.getElementById("bookTitle").textContent = book.title;

function renderChapters() {
    const chapters = HerChapters.getAll(book.id);
    const grid = document.getElementById("chapterGrid");

    grid.innerHTML = chapters.map(chapter => `
        <div class="chapter-card" onclick="openChapter('${chapter.id}')">
            <div class="chapter-card-title">${chapter.title}</div>
            <div class="chapter-card-meta">${chapter.status || "Draft"} • ${HerWordCount.countWords(chapter.content || "")} words</div>
        </div>
    `).join("");
}

function createChapter() {
    const title = prompt("Chapter title:") || "New Chapter";
    HerChapters.create(book.id, title);
    HerNotifications.success("Chapter created");
    renderChapters();
}

function openChapter(chapterId) {
    localStorage.setItem(HerConfig.storageKeys.currentChapter, chapterId);
    window.location.href = "editor.html";
}

renderChapters();
</script>

</body>
</html>
