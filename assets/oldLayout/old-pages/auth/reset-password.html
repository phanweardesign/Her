<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Her</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body class="auth-page">

<main class="auth-card">
    <div class="text-center">
        <h1>Reset Password</h1>
        <p class="card-text">Create a new password for your account.</p>
    </div>

    <form class="form" id="resetPasswordForm">
        <div>
            <label class="label label-required">New Password</label>
            <input class="input" id="password" type="password" required>
        </div>

        <div>
            <label class="label label-required">Confirm Password</label>
            <input class="input" id="confirmPassword" type="password" required>
        </div>

        <button class="btn" type="submit">Reset Password</button>
    </form>

    <div class="text-center">
        <p><a href="login.html">Back to Login</a></p>
    </div>
</main>

<script src="../../js/config.js"></script>
<script src="../../js/utils/helpers.js"></script>
<script src="../../js/utils/validation.js"></script>
<script src="../../js/modules/ui/notifications.js"></script>
<script src="../../js/app.js"></script>

<script>
document.getElementById("resetPasswordForm").addEventListener("submit", function(e){
    e.preventDefault();

    const password = getInputValue("#password");
    const confirmPassword = getInputValue("#confirmPassword");

    if (!HerValidation.password(password)) {
        HerNotifications.error("Password must be at least 8 characters.");
        return;
    }

    if (!HerValidation.match(password, confirmPassword)) {
        HerNotifications.error("Passwords do not match.");
        return;
    }

    HerNotifications.success("Password reset feature is ready for backend connection.");
});
</script>

</body>
</html>
