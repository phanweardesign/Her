<!DOCTYPE html> 
<html lang="en"> 
    <head> 
        <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Her - Your Books</title> 
        <style> *{ margin:0; padding:0; box-sizing:border-box; font-family:Arial, Helvetica, sans-serif; } body{ background:#faf8f2; padding:20px; } .header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; } .title{ font-size:28px; color:#5B3FD6; font-weight:bold; } .btn{ background:#5B3FD6; color:white; border:none; padding:10px 14px; border-radius:10px; cursor:pointer; } .search{ width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; margin-bottom:20px; font-size:16px; } .book-list{ display:flex; flex-direction:column; gap:12px; } .book{ background:white; padding:15px; border-radius:12px; box-shadow:0 5px 15px rgba(0,0,0,0.08); cursor:pointer; } .book h3{ margin-bottom:5px; color:#222; } .book small{ color:#777; } .empty{ text-align:center; color:#888; margin-top:40px; } 
        </style> 
        </head> 
        <body> 
            <div class="header"> 
                <div class="title">📚 Her</div> 
                <button class="btn" onclick="createBook()">+ New Book</button> 
                </div> 
                <input class="search" placeholder="Search your books..." oninput="searchBooks(this.value)"> 
                <div id="bookList" class="book-list"></div> 
                <div id="empty" class="empty">No books yet. Create your first story ✨</div> 
				<script src="../js/storage.js"></script>
                <script> let books = getBooks(); function renderBooks(list = books){ const container = document.getElementById("bookList"); const empty = document.getElementById("empty"); container.innerHTML = ""; if(list.length === 0){ empty.style.display = "block"; return; } else { empty.style.display = "none"; } list.forEach((book, index) => { const div = document.createElement("div"); div.className = "book"; div.onclick = () => openBook(index); div.innerHTML = ` 
                    <h3>${book.title}</h3> 
                    <small>Last edited: ${book.date}</small> `; container.appendChild(div); }); } 
					function createBook(){
    const title = prompt("Enter book title:");
    if(!title) return;

    const newBook = {
        title: title,
        chapters: [
            {
                title: "Chapter 1",
                content: ""
            }
        ],
        date: new Date().toLocaleString()
    };

} books.push(newBook); saveBooks(books); renderBooks(); } 
function openBook(index){ setCurrentBookIndex(index); window.location.href = "editor.html"; } 
function searchBooks(query){ const filtered = books.filter(b => b.title.toLowerCase().includes(query.toLowerCase()) ); renderBooks(filtered); } renderBooks(); 
</script> 
</body>
</html>
