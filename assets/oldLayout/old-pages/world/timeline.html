<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline | Her</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body class="page-timeline">

<header class="app-header">
    <div class="logo">📚 Her</div>
    <nav class="navbar">
        <a class="nav-link" href="world.html">World Bible</a>
        <a class="nav-link" href="locations.html">Locations</a>
        <a class="nav-link" href="magic.html">Magic</a>
        <a class="nav-link active" href="timeline.html">Timeline</a>
    </nav>
</header>

<main class="container section">
    <div class="header-left" style="justify-content:space-between;">
        <div>
            <h1>📅 Timeline</h1>
            <p class="card-text">Track story events, history, wars, and major moments.</p>
        </div>
        <button class="btn" onclick="createEvent()">+ Event</button>
    </div>

    <section class="timeline" id="timelineList" style="margin-top:30px;"></section>
</main>

<script src="../js/config.js"></script>
<script src="../js/utils/constants.js"></script>
<script src="../js/utils/helpers.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/modules/books/books.js"></script>
<script src="../js/modules/timeline/timeline.js"></script>
<script src="../js/modules/ui/notifications.js"></script>
<script src="../js/app.js"></script>

<script>
const book = HerBooks.getCurrent();
if (!book) window.location.href = "books.html";

function renderTimeline() {
    const events = HerTimeline.sort(book.id);
    const list = document.getElementById("timelineList");

    if (events.length === 0) {
        list.innerHTML = `<div class="card"><h2 class="card-title">No timeline events yet</h2><p class="card-text">Create your first event.</p></div>`;
        return;
    }

    list.innerHTML = events.map(event => `
        <div class="timeline-item">
            <div class="timeline-title">${event.title}</div>
            <div class="timeline-date">${event.date || event.type || "Story Event"}</div>
            <div class="timeline-text">${event.description || "No description yet."}</div>
        </div>
    `).join("");
}

function createEvent() {
    const title = prompt("Event title:");
    if (!title) return;

    const date = prompt("Date or year:") || "";
    const description = prompt("Description:") || "";

    HerTimeline.create(book.id, { title, date, description });
    HerNotifications.success("Timeline event created");
    renderTimeline();
}

renderTimeline();
</script>

</body>
</html>
