<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizations | Her</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body class="page-world">

<header class="app-header">
    <div class="logo">📚 Her</div>
    <nav class="navbar">
        <a class="nav-link" href="world.html">World Bible</a>
        <a class="nav-link" href="locations.html">Locations</a>
        <a class="nav-link active" href="organizations.html">Organizations</a>
        <a class="nav-link" href="timeline.html">Timeline</a>
    </nav>
</header>

<main class="container section">
    <div class="header-left" style="justify-content:space-between;">
        <div>
            <h1>🏰 Organizations</h1>
            <p class="card-text">Factions, guilds, governments, armies, and religions.</p>
        </div>
        <button class="btn" onclick="createOrganization()">+ Organization</button>
    </div>

    <section class="encyclopedia-grid" id="organizationGrid" style="margin-top:25px;"></section>
</main>

<script src="../js/config.js"></script>
<script src="../js/utils/constants.js"></script>
<script src="../js/utils/helpers.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/modules/books/books.js"></script>
<script src="../js/modules/world/organizations.js"></script>
<script src="../js/modules/ui/notifications.js"></script>
<script src="../js/app.js"></script>

<script>
const book = HerBooks.getCurrent();
if (!book) window.location.href = "books.html";

function renderOrganizations() {
    const organizations = HerOrganizations.getAll(book.id);
    const grid = document.getElementById("organizationGrid");

    if (organizations.length === 0) {
        grid.innerHTML = `<div class="card"><h2 class="card-title">No organizations yet</h2><p class="card-text">Create your first faction or group.</p></div>`;
        return;
    }

    grid.innerHTML = organizations.map(org => `
        <div class="organization-card">
            <div class="organization-name">${org.name}</div>
            <div class="organization-meta">${org.type || "Faction"} ${org.leader ? "• Leader: " + org.leader : ""}</div>
            <div class="organization-purpose">${org.purpose || "No purpose written yet."}</div>
        </div>
    `).join("");
}

function createOrganization() {
    const name = prompt("Organization name:");
    if (!name) return;

    const type = prompt("Type:", "Faction") || "Faction";
    const leader = prompt("Leader:") || "";

    HerOrganizations.create(book.id, { name, type, leader });
    HerNotifications.success("Organization created");
    renderOrganizations();
}

renderOrganizations();
</script>

</body>
</html>
