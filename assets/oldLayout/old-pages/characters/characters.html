<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Characters | Her</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body class="page-characters">

<header class="app-header">
    <div class="logo">📚 Her</div>

    <nav class="navbar">
        <a class="nav-link" href="dashboard.html">Dashboard</a>
        <a class="nav-link" href="books.html">Books</a>
        <a class="nav-link active" href="characters.html">Characters</a>
        <a class="nav-link" href="world.html">World Bible</a>
    </nav>
</header>

<main class="container section">

    <div class="header-left" style="justify-content:space-between;">
        <div>
            <h1>Characters</h1>
            <p class="card-text">Create and manage your cast for the current book.</p>
        </div>

        <button class="btn" onclick="createCharacter()">+ Character</button>
    </div>

    <section class="character-grid" id="characterGrid" style="margin-top:25px;"></section>

</main>

<script src="../js/config.js"></script>
<script src="../js/utils/constants.js"></script>
<script src="../js/utils/helpers.js"></script>
<script src="../js/storage.js"></script>

<script src="../js/modules/books/books.js"></script>
<script src="../js/modules/characters/characters.js"></script>
<script src="../js/modules/ui/notifications.js"></script>
<script src="../js/app.js"></script>

<script>
const book = HerBooks.getCurrent();

if (!book) {
    window.location.href = "books.html";
}

function renderCharacters() {
    const grid = document.getElementById("characterGrid");
    const characters = HerCharacters.getAll(book.id);

    if (characters.length === 0) {
        grid.innerHTML = `
            <div class="card">
                <h2 class="card-title">No characters yet</h2>
                <p class="card-text">Create your first character for this book.</p>
            </div>
        `;
        return;
    }

    grid.innerHTML = characters.map(character => `
        <div class="character-card" onclick="openCharacter('${character.id}')">

            <div class="character-portrait">
                ${
                    character.portrait
                    ? `<img src="${character.portrait}" alt="${character.name}">`
                    : `<span>${(character.name || "?").charAt(0)}</span>`
                }
            </div>

            <div class="character-card-info">
                <div class="character-card-name">${character.name}</div>
                <div class="character-card-role">${character.role || "Supporting Character"}</div>
                <div class="character-card-description">
                    ${character.personality || character.notes || "No description yet."}
                </div>
            </div>

        </div>
    `).join("");
}

function createCharacter() {
    const name = prompt("Character name:");
    if (!name) return;

    const character = HerCharacters.create(book.id, { name });

    HerNotifications.success("Character created");
    openCharacter(character.id);
}

function openCharacter(characterId) {
    localStorage.setItem(HerConfig.storageKeys.currentCharacter, characterId);
    window.location.href = "character-profile.html";
}

renderCharacters();
</script>

</body>
</html>
